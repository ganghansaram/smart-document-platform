<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan-60 PoC — Toast UI Editor (폐쇄망 드롭인)</title>

<!-- 1. 플랫폼 디자인 토큰 (SSOT) -->
<link rel="stylesheet" href="css/tokens.css">
<!-- 2. Toast UI Editor — 자가호스팅 벤더 번들 (CDN 미사용, Monaco 선례) -->
<link rel="stylesheet" href="js/lib/tui-editor/toastui-editor.min.css">

<style>
  /* PoC 전용 셸 — 토큰만 사용, 하드코딩 색상 금지 */
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
  }
  .poc-bar {
    display: flex; align-items: center; gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-secondary);
  }
  .poc-bar h1 { font-size: var(--font-title); margin: 0; font-weight: 600; }
  .poc-bar .spacer { flex: 1; }
  .poc-btn {
    padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
    border: 1px solid var(--active-color);
    background: var(--active-color); color: #fff;
    cursor: pointer; font-size: var(--font-body);
  }
  .poc-btn.ghost { background: transparent; color: var(--active-color); }
  .poc-note {
    padding: var(--space-md) var(--space-lg);
    font-size: var(--font-small); color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
  }
  #editor { padding: var(--space-lg); }
  #md-out {
    margin: 0 var(--space-lg) var(--space-lg);
    padding: var(--space-md);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
    white-space: pre-wrap; font-family: monospace; font-size: var(--font-small);
    display: none;
  }

  /* ── 디자인 토큰 브리지 (시연) ──
     Toast UI 기본 스킨 → 플랫폼 악센트 통일. Phase 2 에서 정식 매핑 시트로 확장. */
  .toastui-editor-defaultUI { border-color: var(--border-color); }
  .toastui-editor-defaultUI-toolbar { background: var(--bg-secondary); }
  .toastui-editor-mode-switch .tab-item.active { color: var(--active-color); }
  .toastui-editor-tabs .tab-item.active { color: var(--active-color); border-color: var(--active-color); }
</style>
</head>
<body>

<div class="poc-bar">
  <h1>Plan-60 PoC — Toast UI Editor (Markdown ↔ WYSIWYG)</h1>
  <span class="spacer"></span>
  <button class="poc-btn ghost" id="btn-theme">다크모드 토글</button>
  <button class="poc-btn" id="btn-md">마크다운 출력 (.md 저장 시뮬)</button>
</div>

<div class="poc-note">
  검증 목적: ① CDN 미접속(전부 <code>js/lib/tui-editor/</code> 로컬) ② 하단 탭으로 Markdown↔WYSIWYG 전환
  ③ "마크다운 출력" = 저장 시 <code>.md</code> 직렬화 확인. 통합(공통 모달·저장 API)은 Phase 1~2.
</div>

<div id="editor"></div>
<pre id="md-out"></pre>

<!-- 3. 벤더 번들 로드 — 독립(-all) 번들 후 한국어 i18n (순서 중요)
     주의: npm @toast-ui/editor 의 toastui-editor.js 는 ProseMirror 를 외부 의존으로 두어
     무빌드 브라우저 로드 불가. NHN 공식 CDN 의 -all.min.js (ProseMirror 내장) 만 드롭인 가능. -->
<script src="js/lib/tui-editor/toastui-editor-all.min.js"></script>
<script src="js/lib/tui-editor/toastui-editor-i18n-ko-kr.min.js"></script>
<script>
  // 무빌드·바닐라 JS — 번들러/모듈 시스템 없이 전역 toastui.Editor 사용
  var editor = new toastui.Editor({
    el: document.querySelector('#editor'),
    height: 'calc(100vh - 230px)',
    initialEditType: 'markdown',   // 기본 마크다운, 탭으로 WYSIWYG 전환
    previewStyle: 'vertical',
    language: 'ko-KR',
    usageStatistics: false,        // 폐쇄망 — 외부 통계 전송 차단
    initialValue: [
      '# 신규 문서 작성 PoC',
      '',
      '일반 엔지니어가 **HTML 을 만지지 않고** 글을 씁니다.',
      '',
      '## 지원 요소',
      '- 목록, **굵게**, *기울임*, `인라인 코드`',
      '- [링크](https://example.com)',
      '',
      '| 항목 | 값 |',
      '| --- | --- |',
      '| 포맷 | Markdown (.md) |',
      '| 서빙 | marked + DOMPurify |',
      '',
      '```js',
      'const greeting = "코드 블록도 지원";',
      '```',
      '',
      '> 하단 탭에서 **Markdown ↔ WYSIWYG** 를 전환해 보세요.'
    ].join('\n')
  });

  // .md 직렬화 증명 (저장 경로 시뮬레이션)
  document.getElementById('btn-md').addEventListener('click', function () {
    var out = document.getElementById('md-out');
    out.style.display = 'block';
    out.textContent = editor.getMarkdown();
  });

  // 플랫폼 다크모드 토큰 브리지 확인
  document.getElementById('btn-theme').addEventListener('click', function () {
    var b = document.body;
    b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
</script>
</body>
</html>
