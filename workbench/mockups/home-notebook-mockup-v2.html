<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook Home — Mockup v2</title>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg-gray);
    color: var(--text-dark);
    min-height: 100vh;
}

/* ── 헤더 ── */
.header {
    height: 48px;
    background: var(--header-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    color: #fff;
    font-size: 13px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.header-logo {
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}
.header-title {
    font-size: 17px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: -0.3px;
}
.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
}
.header-right a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    cursor: pointer;
}
.header-right a:hover { color: #fff; }

/* ── 히어로: Notebook — 깊은 밤하늘 (탐구/몰입) ── */
.hero {
    position: relative;
    width: 100%;
    height: 210px;
    overflow: hidden;
    background: linear-gradient(135deg, #0a1628 0%, #1a2744 30%, #2a3a5c 60%, #1e2d4a 100%);
}
/* 은하수 질감 */
.hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(1px 1px at 10% 20%, rgba(200,220,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 60%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 15%, rgba(200,220,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 75%, rgba(200,220,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 35%, rgba(200,220,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 55%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 80%, rgba(200,220,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 45%, rgba(200,220,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 15%, rgba(200,220,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 33% 40%, rgba(180,210,255,1) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 70%, rgba(180,210,255,0.9) 0%, transparent 100%),
        radial-gradient(80px 80px at 50% 50%, rgba(100,140,200,0.08) 0%, transparent 100%);
}
/* 부드러운 성운 빛 */
.hero::after {
    content: '';
    position: absolute;
    width: 300px;
    height: 200px;
    top: 10%;
    right: 15%;
    background: radial-gradient(ellipse, rgba(100,130,200,0.12) 0%, transparent 70%);
    filter: blur(30px);
}
.hero-star {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(200, 220, 255, 0.9);
    z-index: 3;
    animation: starPulse 4s ease-in-out infinite;
    top: 25%; left: 55%;
}
.hero-star-2 {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(200, 220, 255, 0.7);
    z-index: 3;
    animation: starPulse 6s ease-in-out 2s infinite;
    top: 40%; left: 78%;
}
@keyframes starPulse {
    0%, 100% { opacity: 0.2; box-shadow: 0 0 4px 1px rgba(180, 210, 255, 0.2); }
    50%      { opacity: 1;   box-shadow: 0 0 10px 3px rgba(180, 210, 255, 0.5); }
}
.hero-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 48px 28px;
    z-index: 4;
}
.hero-title {
    font-size: 30px;
    font-weight: 300;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
    letter-spacing: -0.5px;
}
.hero-sub {
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.65);
    margin-top: 5px;
    letter-spacing: 0.2px;
}
.hero-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: linear-gradient(to top, var(--bg-gray), transparent);
    z-index: 5;
}

/* ── 콘텐츠 ── */
.content {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 32px 48px;
}

/* ── 업로드 (컴팩트 한 줄) ── */
.upload-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1.5px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px 24px;
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: border-color var(--transition-fast), background var(--transition-fast);
}
.upload-bar:hover {
    border-color: var(--active-color);
    background: rgba(44, 82, 130, 0.03);
}
.upload-bar svg {
    width: 18px;
    height: 18px;
    stroke: var(--text-light);
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
}
.upload-bar:hover svg { stroke: var(--active-color); }

/* ── 통계 + 뷰 토글 ── */
.toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-light);
}
.toolbar strong {
    font-size: 15px;
    color: var(--text-dark);
}
.toolbar .spacer { flex: 1; }
.view-toggle {
    display: flex;
    gap: 2px;
}
.view-toggle button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
}
.view-toggle button.active {
    background: var(--active-color);
    color: #fff;
    border-color: var(--active-color);
}

/* ── 카드 그리드 ── */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 14px;
}
.doc-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.doc-card:hover {
    border-color: var(--active-color);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
}
.doc-card-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 5px;
}
.doc-card-meta {
    font-size: 12px;
    color: var(--active-color);
    margin-bottom: 4px;
}
.doc-card-status {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 12px;
}
.doc-card-actions {
    display: flex;
    gap: 8px;
}
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="header-logo">N</div>
        <span class="header-title">Research Notebook</span>
    </div>
    <div class="header-right">
        <a>Search</a>
        <span>testbot</span>
        <a>Logout</a>
    </div>
</div>

<div class="hero">
    <div class="hero-star"></div>
    <div class="hero-star-2"></div>
    <div class="hero-overlay">
        <div class="hero-title">Your Docs, Your Knowledge</div>
        <div class="hero-sub">PDF 번역 &middot; AI 분석 &middot; 마인드맵 &middot; 개인 지식 저장소</div>
    </div>
    <div class="hero-fade"></div>
</div>

<div class="content">
    <div class="upload-bar">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
        PDF 파일을 드래그하거나 클릭하여 업로드 (최대 100MB)
    </div>

    <div class="toolbar">
        <strong>3개 문서</strong>
        <span>PDF 2건 번역됨</span>
        <span>&middot;</span>
        <span>메모 1건</span>
        <span class="spacer"></span>
        <div class="view-toggle">
            <button title="목록형">&#9776;</button>
            <button class="active" title="타일형">&#9638;</button>
        </div>
    </div>

    <div class="card-grid">
        <div class="doc-card">
            <div class="doc-card-name">MIL-STD-38784B.pdf</div>
            <div class="doc-card-meta">138페이지 &middot; 2026-04-05</div>
            <div class="doc-card-status">준비됨</div>
            <div class="doc-card-actions">
                <button class="btn btn-primary btn-sm">열기</button>
                <button class="btn btn-secondary btn-sm">삭제</button>
            </div>
        </div>
        <div class="doc-card">
            <div class="doc-card-name">6_TechDoc.pdf</div>
            <div class="doc-card-meta">4페이지 &middot; 2026-03-30</div>
            <div class="doc-card-status">PDF 1/4</div>
            <div class="doc-card-actions">
                <button class="btn btn-primary btn-sm">열기</button>
                <button class="btn btn-secondary btn-sm">삭제</button>
            </div>
        </div>
        <div class="doc-card">
            <div class="doc-card-name">test.pdf</div>
            <div class="doc-card-meta">4페이지 &middot; 2026-03-06</div>
            <div class="doc-card-status">PDF 1/4 &middot; 웹뷰 1/4 &middot; 메모 1</div>
            <div class="doc-card-actions">
                <button class="btn btn-primary btn-sm">열기</button>
                <button class="btn btn-secondary btn-sm">삭제</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
