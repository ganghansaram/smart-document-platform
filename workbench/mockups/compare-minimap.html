<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare 미니맵 목업</title>
<style>
/* ── tokens.css 발췌 ── */
:root {
    --primary-navy: #001f3f;
    --dark-gray: #2c3e50;
    --medium-gray: #7f8c8d;
    --light-gray: #ecf0f1;
    --bg-gray: #f5f7fa;
    --white: #ffffff;
    --text-dark: #2c3e50;
    --text-light: #7f8c8d;
    --border-color: #dde4e8;
    --hover-bg: #e8f4f8;
    --active-color: #2c5282;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
    --space-sm: 8px;
    --space-md: 16px;
    --radius-sm: 4px;
    --transition-fast: 0.15s ease;

    --diff-added: #e6ffec;
    --diff-deleted: #fce4e4;
    --diff-modified: #fef3cd;
    --diff-added-border: #2ea043;
    --diff-deleted-border: #f85149;
    --diff-modified-border: #f59e0b;
    --diff-added-word: #86efac;
    --diff-deleted-word: #fca5a5;
}

body[data-theme="dark"] {
    --primary-navy: #121218;
    --dark-gray: #e0e0e0;
    --medium-gray: #a0a4b8;
    --light-gray: #252738;
    --bg-gray: #121218;
    --white: #1e1e2e;
    --text-dark: #e0e0e0;
    --text-light: #a0a4b8;
    --border-color: #3d3f50;
    --hover-bg: #2d2f3e;
    --active-color: #63a0e0;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.15);

    --diff-added: rgba(46,160,67,0.15);
    --diff-deleted: rgba(248,81,73,0.25);
    --diff-modified: rgba(245,158,11,0.25);
    --diff-added-border: #3fb950;
    --diff-deleted-border: #f85149;
    --diff-modified-border: #d29922;
    --diff-added-word: rgba(46,160,67,0.4);
    --diff-deleted-word: rgba(248,81,73,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-gray); color: var(--text-dark); }

/* ── 레이아웃 ── */
.demo-header {
    background: linear-gradient(135deg, var(--primary-navy), #003d7a);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    height: 48px;
}
.demo-header h1 { font-size: 15px; font-weight: 600; }

.demo-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    background: var(--white);
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    color: var(--text-light);
}

.demo-main {
    display: flex;
    height: calc(100vh - 48px - 37px);
}

/* ── 패널 (좌/우) ── */
.panel-wrap {
    flex: 1;
    display: flex;
    position: relative;
    border-right: 1px solid var(--border-color);
}
.panel-wrap:last-of-type { border-right: none; }

.panel-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px 12px;
    background: var(--white);
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    font-weight: 600;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
}

.panel-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 44px 16px 16px;
    background: var(--white);
    /* 스크롤바 숨김 — 미니맵이 대체 */
    scrollbar-width: none;
}
.panel-scroll::-webkit-scrollbar { display: none; }

/* ── 단락 ── */
.para {
    padding: 6px 10px;
    margin-bottom: 2px;
    font-size: 14px;
    line-height: 1.65;
    border-left: 3px solid transparent;
    border-radius: 2px;
    transition: background var(--transition-fast);
}
.para.added {
    background: var(--diff-added);
    border-left-color: var(--diff-added-border);
}
.para.deleted {
    background: var(--diff-deleted);
    border-left-color: var(--diff-deleted-border);
}
.para.modified {
    background: var(--diff-modified);
    border-left-color: var(--diff-modified-border);
}
.para .word-add { background: var(--diff-added-word); border-radius: 2px; padding: 0 1px; }
.para .word-del { background: var(--diff-deleted-word); border-radius: 2px; padding: 0 1px; text-decoration: line-through; }

/* ── 미니맵 ── */
.minimap {
    width: 12px;
    flex-shrink: 0;
    position: relative;
    background: var(--bg-gray);
    border-left: 1px solid var(--border-color);
    cursor: pointer;
    user-select: none;
}

/* 뷰포트 인디케이터 */
.minimap-viewport {
    position: absolute;
    left: 0;
    width: 100%;
    background: rgba(44, 82, 130, 0.10);
    border: 1px solid rgba(44, 82, 130, 0.25);
    border-radius: 2px;
    transition: top 0.08s ease, height 0.08s ease;
    pointer-events: none;
}
body[data-theme="dark"] .minimap-viewport {
    background: rgba(99, 160, 224, 0.12);
    border-color: rgba(99, 160, 224, 0.3);
}

/* 변경 마커 */
.minimap-marker {
    position: absolute;
    left: 2px;
    right: 2px;
    min-height: 3px;
    border-radius: 1px;
    transition: opacity var(--transition-fast);
}
.minimap-marker:hover { opacity: 0.8; }
.minimap-marker.added { background: var(--diff-added-border); }
.minimap-marker.deleted { background: var(--diff-deleted-border); }
.minimap-marker.modified { background: var(--diff-modified-border); }

/* 호버 시 미니맵 확대 효과 */
.minimap:hover {
    width: 18px;
}
.minimap:hover .minimap-marker {
    left: 3px;
    right: 3px;
}

/* 활성 마커 강조 */
.minimap-marker.active {
    left: 0;
    right: 0;
    box-shadow: 0 0 4px rgba(0,0,0,0.2);
}

/* ── 사이드바 (간략) ── */
.sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--white);
    border-left: 1px solid var(--border-color);
    padding: 12px;
    overflow-y: auto;
    font-size: 13px;
}
.sidebar h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-light);
}
.sidebar-item {
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background var(--transition-fast);
}
.sidebar-item:hover { background: var(--hover-bg); }
.sidebar-item .badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    color: #fff;
    font-weight: 600;
    flex-shrink: 0;
}
.badge.added { background: var(--diff-added-border); }
.badge.deleted { background: var(--diff-deleted-border); }
.badge.modified { background: var(--diff-modified-border); }

/* ── 테마 토글 ── */
.theme-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
}
.theme-btn:hover { background: rgba(255,255,255,0.1); }

/* ── 안내 ── */
.guide {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark-gray);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 100;
    opacity: 0.9;
    pointer-events: none;
}
body[data-theme="dark"] .guide { background: var(--active-color); }
</style>
</head>
<body>

<div class="demo-header">
    <h1>Compare — 미니맵 개요 바 목업</h1>
    <button class="theme-btn" onclick="toggleTheme()">Light / Dark</button>
</div>

<div class="demo-toolbar">
    <span>SWA_PMS_r0.docx ↔ SWA_PMS_r1.docx</span>
    <span style="margin-left:auto; color:var(--diff-added-border)">+12</span>
    <span style="color:var(--diff-deleted-border)">-8</span>
    <span style="color:var(--diff-modified-border)">~15</span>
    <span style="margin-left:8px">총 35건</span>
</div>

<div class="demo-main">
    <!-- 좌측 패널 (원본) -->
    <div class="panel-wrap">
        <div class="panel-header">
            <span>SWA_PMS_r0.docx</span>
            <span style="color:var(--text-light); font-weight:400">(원본)</span>
        </div>
        <div class="panel-scroll" id="panel-a"></div>
        <div class="minimap" id="minimap-a">
            <div class="minimap-viewport" id="viewport-a"></div>
        </div>
    </div>

    <!-- 우측 패널 (수정본) -->
    <div class="panel-wrap">
        <div class="panel-header">
            <span>SWA_PMS_r1.docx</span>
            <span style="color:var(--text-light); font-weight:400">(수정본)</span>
        </div>
        <div class="panel-scroll" id="panel-b"></div>
        <div class="minimap" id="minimap-b">
            <div class="minimap-viewport" id="viewport-b"></div>
        </div>
    </div>

    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar"></div>
</div>

<div class="guide">미니맵 마커를 클릭하면 해당 변경점으로 이동합니다 &middot; 호버 시 확대</div>

<script>
// ── 샘플 데이터 생성 ──
var SAMPLE = [];
var TYPES = ['normal','normal','normal','added','normal','deleted','normal','modified','normal','normal'];
var TEXTS_A = [
    '1. 적용 범위 — 본 규격서는 항공기 배관 체계에 사용되는 밸브류의 설계, 제조 및 시험 요건을 규정한다.',
    '1.1 본 규격서는 MIL-V-5509 및 관련 군사 규격을 보완하며, 국내 운용 환경에 적합하도록 추가 요건을 명시한다.',
    '2. 참조 문서 — MIL-STD-810H, MIL-V-5509F, KS W 0802, KDS 17 10 00',
    '3. 재료 요건 — 밸브 본체는 스테인리스강 316L 또는 동등 이상의 내식성 소재를 사용하여야 한다.',
    '3.1 실링 소재는 PTFE, Viton, 또는 발주자가 승인한 동등 소재로 한다. 사용 온도 범위는 -54°C ~ +200°C.',
    '3.2 볼트 및 너트류는 ASTM A193 B8M 이상의 등급을 충족하여야 한다.',
    '4. 설계 요건 — 밸브는 최대 작동 압력(MOP)의 1.5배에서 수압 시험을 통과하여야 한다.',
    '4.1 허용 누설량은 시트 누설 등급 Class IV(ANSI/FCI 70-2) 이하로 한다.',
    '4.2 작동 토크는 밸브 크기별로 아래 표에 명시된 최대값 이하이어야 한다.',
    '5. 시험 요건 — 다음 항목에 대해 형식 시험을 실시하여야 한다: (a) 수압 시험, (b) 기밀 시험, (c) 내구성 시험.',
    '5.1 수압 시험: MOP × 1.5 압력에서 5분간 유지, 누설 및 변형 없어야 한다.',
    '5.2 기밀 시험: 작동 압력에서 질소 가스 또는 헬륨으로 실시, 누설량 Class IV 이하.',
    '5.3 내구성 시험: 전개폐 10,000회 반복 후 성능 저하 없어야 한다.',
    '6. 표시 및 포장 — 각 밸브에는 제조번호, 제조일, MOP, 재질 등을 영구 표시하여야 한다.',
    '6.1 포장은 MIL-STD-2073에 따르며, 방습 및 충격 방지 조치를 포함한다.',
    '7. 품질 보증 — 제조업체는 ISO 9001 또는 AS9100 인증을 보유하여야 한다.',
    '7.1 납품 시 시험 성적서, 재료 성적서(Mill Certificate), 치수 검사 보고서를 제출하여야 한다.',
    '8. 납품 일정 — 계약일로부터 120일 이내 초도품 제출, 180일 이내 전량 납품.',
    '부록 A — 밸브 크기별 최대 작동 토크',
    '부록 B — 참조 규격 일람표'
];

// 변경 패턴 시뮬레이션 (랜덤 배치)
var changeIndices = [2, 5, 7, 8, 10, 11, 13, 16, 3, 6, 9, 14, 17, 1, 18];
var changeTypes =   ['modified','deleted','modified','added','modified','added','deleted','modified','added','modified','deleted','added','modified','deleted','added'];

var paraDataA = [];
var paraDataB = [];

for (var i = 0; i < TEXTS_A.length; i++) {
    var ci = changeIndices.indexOf(i);
    var type = ci >= 0 ? changeTypes[ci] : 'normal';
    paraDataA.push({ text: TEXTS_A[i], type: type === 'added' ? 'normal' : type, idx: i });
    paraDataB.push({ text: TEXTS_A[i], type: type === 'deleted' ? 'normal' : type, idx: i });
}

// 텍스트 변형 (수정본)
paraDataB[2].text = '2. 참조 문서 — MIL-STD-810J (Rev), MIL-V-5509G, KS W 0802, KDS 17 10 00, AMS 2750F';
paraDataB[7].text = '4. 설계 요건 — 밸브는 최대 작동 압력(MOP)의 2.0배에서 수압 시험을 통과하여야 한다.';
paraDataB[8].text = '4.1 허용 누설량은 시트 누설 등급 Class V (ANSI/FCI 70-2) 이하로 한다. 연 1회 재검증 필수.';
paraDataB[10].text = '5.1 수압 시험: MOP × 2.0 압력에서 10분간 유지, 누설 및 변형 없어야 한다.';
paraDataB[16].text = '7.1 납품 시 시험 성적서, 재료 성적서(Mill Certificate), 치수 검사 보고서, 비파괴검사(NDT) 보고서를 제출하여야 한다.';

// ── DOM 생성 ──
var panelA = document.getElementById('panel-a');
var panelB = document.getElementById('panel-b');
var sidebar = document.getElementById('sidebar');

sidebar.innerHTML = '<h3>변경 목록 (35건)</h3>';

function buildParagraphs(data, container, side) {
    data.forEach(function(p, i) {
        var div = document.createElement('div');
        div.className = 'para' + (p.type !== 'normal' ? ' ' + p.type : '');
        div.id = side + '-p' + i;
        div.textContent = p.text;
        container.appendChild(div);
    });
}

buildParagraphs(paraDataA, panelA, 'a');
buildParagraphs(paraDataB, panelB, 'b');

// 사이드바 항목
var changeList = [];
changeIndices.forEach(function(idx, ci) {
    changeList.push({ idx: idx, type: changeTypes[ci] });
});
changeList.sort(function(a,b){ return a.idx - b.idx; });

changeList.forEach(function(c, i) {
    var item = document.createElement('div');
    item.className = 'sidebar-item';
    var badge = document.createElement('span');
    badge.className = 'badge ' + c.type;
    badge.textContent = c.type === 'added' ? '추가' : c.type === 'deleted' ? '삭제' : '수정';
    var label = document.createElement('span');
    label.textContent = TEXTS_A[c.idx].substring(0, 28) + '…';
    label.style.overflow = 'hidden';
    label.style.textOverflow = 'ellipsis';
    label.style.whiteSpace = 'nowrap';
    item.appendChild(badge);
    item.appendChild(label);
    item.addEventListener('click', function() {
        scrollToChange(c.idx);
    });
    sidebar.appendChild(item);
});

// ── 미니맵 로직 ──
function setupMinimap(panelId, minimapId, viewportId, data) {
    var panel = document.getElementById(panelId);
    var minimap = document.getElementById(minimapId);
    var viewport = document.getElementById(viewportId);

    function getChanges() {
        var paras = panel.querySelectorAll('.para');
        var changes = [];
        var totalH = panel.scrollHeight;
        paras.forEach(function(p, i) {
            var d = data[i];
            if (d.type !== 'normal') {
                changes.push({
                    top: p.offsetTop / totalH,
                    height: p.offsetHeight / totalH,
                    type: d.type,
                    idx: d.idx
                });
            }
        });
        return { changes: changes, totalH: totalH };
    }

    function renderMarkers() {
        // 기존 마커 제거
        minimap.querySelectorAll('.minimap-marker').forEach(function(m) { m.remove(); });

        var info = getChanges();
        var mapH = minimap.clientHeight;

        info.changes.forEach(function(c) {
            var marker = document.createElement('div');
            marker.className = 'minimap-marker ' + c.type;
            marker.style.top = (c.top * mapH) + 'px';
            marker.style.height = Math.max(3, c.height * mapH) + 'px';
            marker.title = (c.type === 'added' ? '추가' : c.type === 'deleted' ? '삭제' : '수정') + ' — 단락 ' + (c.idx + 1);
            marker.dataset.idx = c.idx;
            minimap.appendChild(marker);
        });
    }

    function updateViewport() {
        var mapH = minimap.clientHeight;
        var scrollH = panel.scrollHeight;
        var clientH = panel.clientHeight;
        if (scrollH <= clientH) {
            viewport.style.display = 'none';
            return;
        }
        viewport.style.display = '';
        var ratio = clientH / scrollH;
        var topRatio = panel.scrollTop / scrollH;
        viewport.style.top = (topRatio * mapH) + 'px';
        viewport.style.height = (ratio * mapH) + 'px';
    }

    // 미니맵 클릭 → 해당 위치로 스크롤
    minimap.addEventListener('click', function(e) {
        var rect = minimap.getBoundingClientRect();
        var clickRatio = (e.clientY - rect.top) / rect.height;
        var targetScroll = clickRatio * panel.scrollHeight - panel.clientHeight / 2;
        panel.scrollTo({ top: targetScroll, behavior: 'smooth' });
    });

    // 뷰포트 드래그
    var dragging = false;
    viewport.style.pointerEvents = 'auto';
    viewport.addEventListener('mousedown', function(e) {
        dragging = true;
        e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        var rect = minimap.getBoundingClientRect();
        var ratio = (e.clientY - rect.top) / rect.height;
        var targetScroll = ratio * panel.scrollHeight - panel.clientHeight / 2;
        panel.scrollTop = Math.max(0, Math.min(targetScroll, panel.scrollHeight - panel.clientHeight));
    });
    document.addEventListener('mouseup', function() { dragging = false; });

    panel.addEventListener('scroll', updateViewport);
    window.addEventListener('resize', function() { renderMarkers(); updateViewport(); });

    // 초기 렌더
    setTimeout(function() { renderMarkers(); updateViewport(); }, 50);
}

setupMinimap('panel-a', 'minimap-a', 'viewport-a', paraDataA);
setupMinimap('panel-b', 'minimap-b', 'viewport-b', paraDataB);

// ── 변경점 이동 ──
function scrollToChange(idx) {
    var elA = document.getElementById('a-p' + idx);
    var elB = document.getElementById('b-p' + idx);
    if (elA) elA.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (elB) elB.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // 미니맵 active 표시
    document.querySelectorAll('.minimap-marker.active').forEach(function(m) { m.classList.remove('active'); });
    document.querySelectorAll('.minimap-marker[data-idx="' + idx + '"]').forEach(function(m) { m.classList.add('active'); });
    setTimeout(function() {
        document.querySelectorAll('.minimap-marker.active').forEach(function(m) { m.classList.remove('active'); });
    }, 2000);
}

// ── 테마 토글 ──
function toggleTheme() {
    var dark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', dark ? '' : 'dark');
    // 미니맵 리렌더
    setTimeout(function() {
        setupMinimap('panel-a', 'minimap-a', 'viewport-a', paraDataA);
        setupMinimap('panel-b', 'minimap-b', 'viewport-b', paraDataB);
    }, 100);
}
</script>
</body>
</html>
