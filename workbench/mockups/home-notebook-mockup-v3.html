<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook Home — Mockup v3</title>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg-gray);
    color: var(--text-dark);
    min-height: 100vh;
}

/* ── 헤더 ── */
.header {
    height: 48px;
    background: var(--header-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    color: #fff;
    font-size: 13px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo {
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
}
.header-title { font-size: 17px; font-weight: 600; font-style: italic; letter-spacing: -0.3px; }
.header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; }
.header-right a { color: rgba(255,255,255,0.7); text-decoration: none; cursor: pointer; }

/* ══════════════════════════════════════════════════════
   히어로: Notebook — 우주 성운 (mesh gradient + grain + stars)
   ══════════════════════════════════════════════════════ */
.hero {
    position: relative;
    width: 100%;
    height: 220px;
    overflow: hidden;
    background: #0a1628;
}

/* ── Mesh gradient blobs (느린 호흡) ── */
.hero-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    will-change: transform, opacity;
}
.hero-blob-1 {
    width: 400px; height: 300px;
    top: -60px; left: -50px;
    background: radial-gradient(ellipse, rgba(30, 60, 120, 0.8) 0%, transparent 70%);
    animation: blobDrift1 25s ease-in-out infinite;
}
.hero-blob-2 {
    width: 350px; height: 280px;
    top: -30px; right: -30px;
    background: radial-gradient(ellipse, rgba(60, 90, 160, 0.6) 0%, transparent 70%);
    animation: blobDrift2 30s ease-in-out infinite;
}
.hero-blob-3 {
    width: 250px; height: 200px;
    bottom: -40px; left: 40%;
    background: radial-gradient(ellipse, rgba(80, 60, 140, 0.5) 0%, transparent 70%);
    animation: blobDrift3 20s ease-in-out infinite;
}
@keyframes blobDrift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(30px, 15px) scale(1.05); }
    66%      { transform: translate(-15px, -10px) scale(0.97); }
}
@keyframes blobDrift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    40%      { transform: translate(-25px, 20px) scale(1.03); }
    70%      { transform: translate(15px, -15px) scale(0.98); }
}
@keyframes blobDrift3 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    50%      { transform: translate(20px, -10px) scale(1.08); opacity: 1; }
}

/* ── 별 ── */
.hero-stars {
    position: absolute;
    inset: 0;
    z-index: 2;
}
.star {
    position: absolute;
    border-radius: 50%;
    background: rgba(200, 220, 255, 0.9);
}
.star-1 { width: 3px; height: 3px; top: 18%; left: 12%; animation: starTwinkle 4s ease-in-out infinite; }
.star-2 { width: 4px; height: 4px; top: 25%; left: 55%; animation: starTwinkle 5s ease-in-out 1s infinite; }
.star-3 { width: 2px; height: 2px; top: 35%; left: 78%; animation: starTwinkle 3.5s ease-in-out 0.5s infinite; }
.star-4 { width: 3px; height: 3px; top: 15%; left: 85%; animation: starTwinkle 6s ease-in-out 2s infinite; }
.star-5 { width: 2px; height: 2px; top: 50%; left: 35%; animation: starTwinkle 4.5s ease-in-out 1.5s infinite; }
.star-6 { width: 2px; height: 2px; top: 60%; left: 65%; animation: starTwinkle 5.5s ease-in-out 0.8s infinite; }
.star-7 { width: 3px; height: 3px; top: 42%; left: 22%; animation: starTwinkle 4s ease-in-out 3s infinite; }
@keyframes starTwinkle {
    0%, 100% { opacity: 0.15; box-shadow: 0 0 3px 1px rgba(180, 210, 255, 0.15); }
    50%      { opacity: 1;    box-shadow: 0 0 8px 3px rgba(180, 210, 255, 0.4); }
}

/* ── Grain 텍스처 오버레이 ── */
.hero-grain {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 0.35;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
}

/* ── 텍스트 오버레이 ── */
.hero-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 48px 28px;
    z-index: 6;
}
.hero-title {
    font-size: 30px;
    font-weight: 300;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
    letter-spacing: -0.5px;
}
.hero-sub {
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.6);
    margin-top: 5px;
    letter-spacing: 0.3px;
}
.hero-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55px;
    background: linear-gradient(to top, var(--bg-gray), transparent);
    z-index: 7;
}

/* ── 콘텐츠 ── */
.content {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 32px 48px;
}

/* ── 업로드 ── */
.upload-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1.5px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px 24px;
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: border-color var(--transition-fast), background var(--transition-fast);
}
.upload-bar:hover {
    border-color: var(--active-color);
    background: rgba(44, 82, 130, 0.03);
}
.upload-bar svg {
    width: 18px; height: 18px;
    stroke: var(--text-light); fill: none; stroke-width: 2; flex-shrink: 0;
}
.upload-bar:hover svg { stroke: var(--active-color); }

/* ── 툴바 ── */
.toolbar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 16px; font-size: 13px; color: var(--text-light);
}
.toolbar strong { font-size: 15px; color: var(--text-dark); }
.toolbar .spacer { flex: 1; }
.view-toggle { display: flex; gap: 2px; }
.view-toggle button {
    width: 30px; height: 30px;
    border: 1px solid var(--border-color); background: var(--bg-card);
    border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; color: var(--text-light);
    display: flex; align-items: center; justify-content: center;
}
.view-toggle button.active {
    background: var(--active-color); color: #fff; border-color: var(--active-color);
}

/* ── 카드 그리드 ── */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 14px;
}
.doc-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.doc-card:hover {
    border-color: var(--active-color);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
}
.doc-card-name { font-size: 14.5px; font-weight: 600; color: var(--text-dark); margin-bottom: 5px; }
.doc-card-meta { font-size: 12px; color: var(--active-color); margin-bottom: 4px; }
.doc-card-status { font-size: 12px; color: var(--text-light); margin-bottom: 12px; }
.doc-card-actions { display: flex; gap: 8px; }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="header-logo">N</div>
        <span class="header-title">Research Notebook</span>
    </div>
    <div class="header-right">
        <a>Search</a>
        <span>testbot</span>
        <a>Logout</a>
    </div>
</div>

<div class="hero">
    <!-- Mesh gradient blobs -->
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    <div class="hero-blob hero-blob-3"></div>
    <!-- Stars -->
    <div class="hero-stars">
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="star star-4"></div>
        <div class="star star-5"></div>
        <div class="star star-6"></div>
        <div class="star star-7"></div>
    </div>
    <!-- Grain overlay -->
    <div class="hero-grain"></div>
    <!-- Text -->
    <div class="hero-overlay">
        <div class="hero-title">Your Docs, Your Knowledge</div>
        <div class="hero-sub">PDF 번역 &middot; AI 분석 &middot; 마인드맵 &middot; 개인 지식 저장소</div>
    </div>
    <div class="hero-fade"></div>
</div>

<div class="content">
    <div class="upload-bar">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7-7 7 7"/></svg>
        PDF 파일을 드래그하거나 클릭하여 업로드 (최대 100MB)
    </div>

    <div class="toolbar">
        <strong>3개 문서</strong>
        <span>PDF 2건 번역됨</span>
        <span>&middot;</span>
        <span>메모 1건</span>
        <span class="spacer"></span>
        <div class="view-toggle">
            <button>&#9776;</button>
            <button class="active">&#9638;</button>
        </div>
    </div>

    <div class="card-grid">
        <div class="doc-card">
            <div class="doc-card-name">MIL-STD-38784B.pdf</div>
            <div class="doc-card-meta">138페이지 &middot; 2026-04-05</div>
            <div class="doc-card-status">준비됨</div>
            <div class="doc-card-actions">
                <button class="btn btn-primary btn-sm">열기</button>
                <button class="btn btn-secondary btn-sm">삭제</button>
            </div>
        </div>
        <div class="doc-card">
            <div class="doc-card-name">6_TechDoc.pdf</div>
            <div class="doc-card-meta">4페이지 &middot; 2026-03-30</div>
            <div class="doc-card-status">PDF 1/4</div>
            <div class="doc-card-actions">
                <button class="btn btn-primary btn-sm">열기</button>
                <button class="btn btn-secondary btn-sm">삭제</button>
            </div>
        </div>
        <div class="doc-card">
            <div class="doc-card-name">test.pdf</div>
            <div class="doc-card-meta">4페이지 &middot; 2026-03-06</div>
            <div class="doc-card-status">PDF 1/4 &middot; 웹뷰 1/4 &middot; 메모 1</div>
            <div class="doc-card-actions">
                <button class="btn btn-primary btn-sm">열기</button>
                <button class="btn btn-secondary btn-sm">삭제</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
