<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Network Spinner Demo</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f5f7fa;
            font-family: -apple-system, sans-serif;
        }
        .demo-wrap {
            display: flex;
            gap: 80px;
            align-items: center;
        }
        .demo-item {
            text-align: center;
        }
        .demo-item p {
            margin-top: 16px;
            font-size: 13px;
            color: #7f8c8d;
        }

        /* ── Network Spinner ── */
        .network-spinner {
            display: inline-block;
            position: relative;
        }

        /* 기본 크기 */
        .network-spinner { width: 40px; height: 40px; }
        .network-spinner-lg { width: 48px; height: 48px; }

        .network-spinner svg {
            width: 100%;
            height: 100%;
            /* GPU 가속: transform으로 합성 레이어 생성 */
            will-change: transform;
            transform: translateZ(0);
        }

        /* 노드 펄스 — 구체 도달 시 커지는 효과 */
        .ns-node-1 { animation: ns-pulse 2.4s ease-in-out infinite; }
        .ns-node-2 { animation: ns-pulse 2.4s ease-in-out 0.8s infinite; }
        .ns-node-3 { animation: ns-pulse 2.4s ease-in-out 1.6s infinite; }

        @keyframes ns-pulse {
            0% { r: 5; opacity: 1; }
            20% { r: 3.5; opacity: 0.7; }
            100% { r: 3.5; opacity: 0.7; }
        }

        /* 이동 구체 — 연결선을 따라 이동 */
        .ns-particle {
            offset-path: path('M 8,30 L 18,15 L 24,35 Z');
            offset-distance: 0%;
            animation: ns-move 2.4s linear infinite;
            will-change: offset-distance;
        }

        @keyframes ns-move {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        /* 모션 민감 사용자 — 정적 표시 */
        @media (prefers-reduced-motion: reduce) {
            .ns-node-1, .ns-node-2, .ns-node-3 { animation: none; }
            .ns-particle { animation: none; display: none; }
        }

        /* 다크모드 대응 */
        @media (prefers-color-scheme: dark) {
            body { background: #121218; }
            .demo-item p { color: #888; }
        }
    </style>
</head>
<body>
    <div class="demo-wrap">
        <!-- 기본 크기 (40px) -->
        <div class="demo-item">
            <div class="network-spinner">
                <svg viewBox="0 0 32 50" fill="none">
                    <!-- 연결선 -->
                    <line x1="8" y1="30" x2="18" y2="15" stroke="#2c5282" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                    <line x1="18" y1="15" x2="24" y2="35" stroke="#2c5282" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                    <line x1="24" y1="35" x2="8" y2="30" stroke="#2c5282" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                    <!-- 노드 (펄스) -->
                    <circle class="ns-node-1" cx="8" cy="30" r="3.5" fill="#2c5282"/>
                    <circle class="ns-node-2" cx="18" cy="15" r="3.5" fill="#2c5282"/>
                    <circle class="ns-node-3" cx="24" cy="35" r="3.5" fill="#2c5282"/>
                    <!-- 이동 구체 -->
                    <circle class="ns-particle" r="2" fill="#2c5282" opacity="0.8"/>
                </svg>
            </div>
            <p>40px (기본)</p>
        </div>

        <!-- 큰 크기 (48px) -->
        <div class="demo-item">
            <div class="network-spinner network-spinner-lg">
                <svg viewBox="0 0 32 50" fill="none">
                    <line x1="8" y1="30" x2="18" y2="15" stroke="#2c5282" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                    <line x1="18" y1="15" x2="24" y2="35" stroke="#2c5282" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                    <line x1="24" y1="35" x2="8" y2="30" stroke="#2c5282" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
                    <circle class="ns-node-1" cx="8" cy="30" r="3.5" fill="#2c5282"/>
                    <circle class="ns-node-2" cx="18" cy="15" r="3.5" fill="#2c5282"/>
                    <circle class="ns-node-3" cx="24" cy="35" r="3.5" fill="#2c5282"/>
                    <circle class="ns-particle" r="2" fill="#2c5282" opacity="0.8"/>
                </svg>
            </div>
            <p>48px (lg)</p>
        </div>
    </div>
</body>
</html>
