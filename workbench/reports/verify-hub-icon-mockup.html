    <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Verify 허브 아이콘 — 모노크롬 시안</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--canvas-bg); color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; padding: 28px 32px 80px;
    transition: background .2s, color .2s; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 22px; }
  .head h1 { font-size: 17px; }
  .toggle { border:1px solid var(--border-color); background:transparent; color:inherit;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12.5px; }
  .variant { margin-bottom: 30px; }
  .variant > .label { font-size:13px; font-weight:700; margin-bottom:12px; color: var(--text-primary); }
  .variant > .label .desc { font-weight:400; font-size:12px; color: var(--text-secondary); margin-left:6px; }

  /* ── verify-hub-card 복제 (entry-card 스킨 인라인) ── */
  .cards { display:flex; gap: 20px; justify-content:center; }
  .card {
    width: 220px; padding: 28px 20px 24px;
    background: var(--content-bg); border: 1px solid var(--border-color);
    border-radius: var(--radius-lg); box-shadow: var(--panel-shadow);
    text-align: center; display:flex; flex-direction:column; align-items:center; gap: 12px;
  }
  .ic { width: 48px; height: 48px; border-radius: var(--radius-md);
    display:inline-flex; align-items:center; justify-content:center; }
  .ic svg { width: 24px; height: 24px; }
  .card h3 { font-size: 15px; font-weight: var(--font-weight-bold); color: var(--text-dark); }
  .card .d { font-size: 12px; color: var(--text-light); line-height: 1.6; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-sm);
    background: var(--bg-gray); color: var(--text-light); border: 1px solid var(--border-color); }

  /* ===== A. 현재 (3색) ===== */
  .vA .ic.t-sim  { background: color-mix(in srgb, var(--color-warning) 10%, transparent); color: var(--color-warning); }
  .vA .ic.t-cmp  { background: color-mix(in srgb, var(--active-color) 10%, transparent); color: var(--active-color); }
  .vA .ic.t-val  { background: color-mix(in srgb, var(--color-success-btn) 10%, transparent); color: var(--color-success-btn); }

  /* ===== B. 중립 모노크롬 (회색 배지) ===== */
  .vB .ic { background: var(--bg-gray); color: var(--text-secondary); }

  /* ===== C. 단일 악센트 (모두 브랜드 블루) ===== */
  .vC .ic { background: var(--active-color-subtle); color: var(--active-color); }

  /* ===== D. 배지 제거 (모노크롬 스트로크만) ===== */
  .vD .ic { background: transparent; color: var(--text-secondary); }
  .vD .ic svg { width: 30px; height: 30px; }
</style>
</head>
<body>
  <div class="head">
    <h1>Verify 허브 아이콘 — 모노크롬 시안 (작업 전 미리보기)</h1>
    <button class="toggle" onclick="document.body.dataset.theme = document.body.dataset.theme==='dark'?'light':'dark'">라이트 / 다크 토글</button>
  </div>

  <!-- 공통 카드 템플릿을 JS로 4벌 생성 -->
  <div id="root"></div>

<script>
  var SIM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>';
  var CMP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>';
  var VAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
  var cards = [
    { ic: SIM, cls:'t-sim', h:'유사도 검사', d:'참조 원문과의 유사 구간을<br>식별하여 표절 리스크 점검', tags:['한↔영','AI 임베딩','규격 매칭'] },
    { ic: CMP, cls:'t-cmp', h:'문서 비교', d:'원본과 수정본의 변경점을<br>단어 수준으로 식별', tags:['Diff','AI 분류','수락/거절'] },
    { ic: VAL, cls:'t-val', h:'규칙 검증', d:'작성 규칙을 자동 점검하고<br>위반 항목을 리포트', tags:['21종 규칙','프리셋','커스텀'] }
  ];
  var variants = [
    { k:'vA', label:'A · 현재 (3색)', desc:'주황/파랑/초록 — "알록달록", 템플릿/생성 느낌 지적 대상.' },
    { k:'vB', label:'B · 중립 모노크롬 (회색 배지)', desc:'배지 회색·아이콘 text-secondary. 가장 절제·차분. 차이는 글리프+라벨.' },
    { k:'vC', label:'C · 단일 악센트 (브랜드 블루)', desc:'세 배지 모두 active-color-subtle. 통일감+브랜드. Vercel/Linear 결.' },
    { k:'vD', label:'D · 배지 제거 (모노크롬 스트로크)', desc:'칩 없이 30px 스트로크 아이콘만. 가장 미니멀.' }
  ];
  var root = document.getElementById('root');
  variants.forEach(function(v){
    var html = '<div class="variant '+v.k+'"><div class="label">'+v.label+' <span class="desc">— '+v.desc+'</span></div><div class="cards">';
    cards.forEach(function(c){
      html += '<div class="card"><span class="ic '+c.cls+'">'+c.ic+'</span>'
        + '<h3>'+c.h+'</h3><div class="d">'+c.d+'</div>'
        + '<div class="tags">'+c.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div></div>';
    });
    html += '</div></div>';
    root.insertAdjacentHTML('beforeend', html);
  });
</script>
</body>
</html>
