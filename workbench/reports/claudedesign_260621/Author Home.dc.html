<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/platform-header.css">
<style>
  body{ background:var(--canvas-bg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif; color:var(--text-primary); }
  .au-card-hover{ transition:border-color var(--transition-normal), transform var(--transition-normal), box-shadow var(--transition-normal); }
  .au-card-hover:hover{ border-color:var(--active-color) !important; transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .au-mode-hover{ transition:border-color var(--transition-normal), transform var(--transition-normal), box-shadow var(--transition-normal); }
  .au-mode-hover:hover{ border-color:var(--active-color) !important; transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .au-row-hover{ transition:background var(--transition-fast); }
  .au-row-hover:hover{ background:var(--hover-bg); }
  .au-ghost-row{ transition:color var(--transition-fast), background var(--transition-fast); }
  .au-ghost-row:hover{ background:var(--active-color-subtle); }
  .au-seg-btn{ transition:all var(--transition-normal); }
</style>
</helmet>

<div style="min-height:100vh; display:flex; flex-direction:column;">

  <header class="platform-header">
    <div class="platform-header-logo">
      <img src="css/images/team_logo.svg" alt="Digital Engineering Team">
      <h1>Author</h1>
      <button class="ph-switcher-btn" type="button" title="시스템 전환" aria-label="시스템 전환" onClick="{{ noop }}">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <circle cx="5" cy="5" r="2.2"></circle><circle cx="12" cy="5" r="2.2"></circle><circle cx="19" cy="5" r="2.2"></circle>
          <circle cx="5" cy="12" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="19" cy="12" r="2.2"></circle>
          <circle cx="5" cy="19" r="2.2"></circle><circle cx="12" cy="19" r="2.2"></circle><circle cx="19" cy="19" r="2.2"></circle>
        </svg>
      </button>
    </div>
    <nav class="platform-header-nav">
      <span class="ph-auth-group" style="display:flex">
        <span class="ph-username">testbot</span>
        <span class="ph-sep">|</span>
        <button class="ph-link" type="button">Logout</button>
      </span>
      <button class="theme-toggle-btn" type="button" title="테마 전환" aria-label="테마 전환" onClick="{{ toggleTheme }}">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main style="flex:1; width:100%; max-width:1160px; margin:0 auto; padding:32px 32px 72px; box-sizing:border-box;">

    <!-- 이어서 작업하기 (resume) -->
    <sc-if value="{{ showResume }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ noop }}" class="au-row-hover" style="width:100%; display:flex; align-items:center; gap:14px; background:var(--content-bg); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:11px 16px; margin-bottom:24px; cursor:pointer; text-align:left; font-family:inherit;">
        <span style="display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:var(--radius-sm); background:var(--active-color-subtle); color:var(--active-color); flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        </span>
        <span style="font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--text-muted); white-space:nowrap; flex-shrink:0;">이어서 작업</span>
        <span style="font-size:13px; font-weight:600; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;">통합 시험 보고서</span>
        <span style="font-size:12px; color:var(--text-muted); white-space:nowrap; flex-shrink:0;">2시간 전 · 본문 4.2 절</span>
        <span style="margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--active-color); white-space:nowrap; flex-shrink:0;">이어서 편집
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </span>
      </button>
    </sc-if>

    <!-- 시작 존 -->
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;">
      <h2 style="font-size:13px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--text-muted);">새로 시작</h2>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:44px;">

      <!-- 빈 문서 작성 -->
      <button type="button" onClick="{{ noop }}" class="au-mode-hover" style="text-align:left; font-family:inherit; cursor:pointer; background:var(--content-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:24px 24px 22px; display:flex; flex-direction:column;">
        <span style="display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:var(--radius-md); background:var(--active-color-subtle); color:var(--active-color); margin-bottom:16px;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </span>
        <span style="font-size:17px; font-weight:700; color:var(--text-primary);">빈 문서 작성</span>
        <span style="font-size:12.5px; color:var(--text-secondary); margin-top:7px; line-height:1.6; flex:1;">통일 양식 골격에서 새 기술 보고서를 마크다운 ↔ WYSIWYG로 작성하고, DOCX로 내보내 워드에서 다듬어 제출합니다.</span>
        <span style="margin-top:16px; display:flex; gap:7px; flex-wrap:wrap;">
          <span style="font-size:11px; font-weight:500; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:5px; padding:3px 9px;">마크다운 SSOT</span>
          <span style="font-size:11px; font-weight:500; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:5px; padding:3px 9px;">통일 양식 프리필</span>
          <span style="font-size:11px; font-weight:500; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:5px; padding:3px 9px;">DOCX 내보내기</span>
        </span>
      </button>

      <!-- 합성 프로젝트 -->
      <sc-if value="{{ synthVisible }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ noop }}" class="au-mode-hover" style="text-align:left; font-family:inherit; cursor:pointer; background:var(--content-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:24px 24px 22px; display:flex; flex-direction:column; position:relative;">
        <span style="display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:var(--radius-md); background:var(--active-color-subtle); color:var(--active-color); margin-bottom:16px;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
        </span>
        <span style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:17px; font-weight:700; color:var(--text-primary);">합성 프로젝트</span>
          <sc-if value="{{ synthBeta }}" hint-placeholder-val="{{ true }}">
            <span class="badge" style="background:var(--color-warning); color:#fff; font-size:10px; padding:2px 7px;">개발중</span>
          </sc-if>
        </span>
        <span style="font-size:12.5px; color:var(--text-secondary); margin-top:7px; line-height:1.6; flex:1;">원문 스펙 2~5개를 나란히 분석해 공통·충돌을 판정하고, 선별 결과로 <span style="color:var(--active-color); font-weight:600;">AI 초안</span>을 생성합니다.</span>
        <span style="margin-top:16px; display:flex; gap:7px; flex-wrap:wrap;">
          <span style="font-size:11px; font-weight:500; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:5px; padding:3px 9px;">다중 소스 합성</span>
          <span style="font-size:11px; font-weight:500; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:5px; padding:3px 9px;">비교 매트릭스</span>
          <span style="font-size:11px; font-weight:500; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:5px; padding:3px 9px;">Verify 검증 연계</span>
        </span>
      </button>
      </sc-if>

    </div>

    <!-- 최근 문서 -->
    <div style="margin-bottom:40px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h3 style="font-size:15px; font-weight:700; color:var(--text-primary); letter-spacing:-.2px;">최근 문서</h3>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="mode-toggle" role="tablist" aria-label="보기 전환">
            <button type="button" class="mode-toggle-btn au-seg-btn" aria-pressed="{{ isCards }}" style="{{ cardsBtnStyle }}" onClick="{{ showCards }}">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>카드
            </button>
            <button type="button" class="mode-toggle-btn au-seg-btn" aria-pressed="{{ isList }}" style="{{ listBtnStyle }}" onClick="{{ showList }}">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>리스트
            </button>
          </div>
          <button type="button" onClick="{{ noop }}" style="font-size:12.5px; color:var(--active-color); cursor:pointer; font-weight:500; background:none; border:none; font-family:inherit;">전체 보기 →</button>
        </div>
      </div>

      <!-- 카드 뷰 -->
      <sc-if value="{{ isCards }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px;">
          <sc-for list="{{ recent }}" as="doc" hint-placeholder-count="3">
            <button type="button" onClick="{{ noop }}" class="au-card-hover" style="text-align:left; font-family:inherit; cursor:pointer; background:var(--content-bg); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:15px 16px; display:flex; flex-direction:column;">
              <span style="display:flex; align-items:center; gap:9px; margin-bottom:11px;">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <span style="font-size:13.5px; font-weight:600; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ doc.name }}</span>
              </span>
              <span style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted);">
                <span>{{ doc.owner }}</span>
                <span style="width:3px; height:3px; border-radius:50%; background:var(--text-muted); display:inline-block;"></span>
                <span>{{ doc.date }}</span>
              </span>
            </button>
          </sc-for>
          <button type="button" onClick="{{ noop }}" class="au-ghost-row" style="font-family:inherit; cursor:pointer; border:1px dashed var(--border-color); border-radius:var(--radius-md); background:transparent; color:var(--active-color); font-weight:600; font-size:13.5px; min-height:90px; display:flex; align-items:center; justify-content:center; gap:8px;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>빈 문서 작성
          </button>
        </div>
      </sc-if>

      <!-- 리스트 뷰 -->
      <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
        <div style="background:var(--content-bg); border:1px solid var(--border-color); border-radius:var(--radius-md); overflow:hidden;">
          <div style="display:grid; grid-template-columns:1fr 150px 100px; gap:12px; padding:9px 18px; border-bottom:1px solid var(--border-color); font-size:11px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; color:var(--text-muted); background:var(--panel-bg);">
            <span>문서명</span><span>작성자</span><span style="text-align:right;">수정일</span>
          </div>
          <sc-for list="{{ recent }}" as="doc" hint-placeholder-count="3">
            <button type="button" onClick="{{ noop }}" class="au-row-hover" style="width:100%; text-align:left; font-family:inherit; cursor:pointer; background:transparent; border:none; border-bottom:1px solid var(--border-color); display:grid; grid-template-columns:1fr 150px 100px; gap:12px; align-items:center; padding:12px 18px;">
              <span style="display:flex; align-items:center; gap:10px; min-width:0;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                <span style="font-size:13px; font-weight:600; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ doc.name }}</span>
              </span>
              <span style="font-size:12.5px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ doc.owner }}</span>
              <span style="font-size:12.5px; color:var(--text-muted); text-align:right;">{{ doc.date }}</span>
            </button>
          </sc-for>
          <button type="button" onClick="{{ noop }}" class="au-ghost-row" style="width:100%; font-family:inherit; cursor:pointer; background:transparent; border:none; color:var(--active-color); font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>빈 문서 작성
          </button>
        </div>
      </sc-if>
    </div>

    <!-- 합성 프로젝트 -->
    <sc-if value="{{ synthVisible }}" hint-placeholder-val="{{ true }}">
    <div style="margin-bottom:36px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h3 style="font-size:15px; font-weight:700; color:var(--text-primary); letter-spacing:-.2px;">합성 프로젝트</h3>
        <button type="button" onClick="{{ noop }}" style="font-size:12.5px; color:var(--active-color); cursor:pointer; font-weight:500; background:none; border:none; font-family:inherit;">전체 보기 →</button>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px;">
        <sc-for list="{{ synth }}" as="proj" hint-placeholder-count="2">
          <button type="button" onClick="{{ noop }}" class="au-card-hover" style="text-align:left; font-family:inherit; cursor:pointer; background:var(--content-bg); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:15px 16px; display:flex; flex-direction:column;">
            <span style="display:flex; align-items:center; gap:9px; margin-bottom:10px;">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--active-color)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 2 2 7l10 5 10-5-10-5Z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
              <span style="font-size:13.5px; font-weight:600; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ proj.name }}</span>
            </span>
            <span style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted);">
              <span style="{{ proj.badgeStyle }}">{{ proj.statusLabel }}</span>
              <span>{{ proj.meta }}</span>
            </span>
            <span style="display:flex; gap:4px; margin-top:11px; flex-wrap:wrap;">
              <sc-for list="{{ proj.sources }}" as="src" hint-placeholder-count="3">
                <span style="font-size:10px; color:var(--text-secondary); background:var(--panel-bg); border:1px solid var(--border-color); border-radius:4px; padding:2px 6px; white-space:nowrap;">{{ src }}</span>
              </sc-for>
            </span>
            <span style="display:flex; gap:3px; margin-top:11px;" title="공통 / 부분 / 충돌 / 단일 분포">
              <sc-for list="{{ proj.segs }}" as="seg" hint-placeholder-count="4">
                <span style="{{ seg }}"></span>
              </sc-for>
            </span>
          </button>
        </sc-for>
        <button type="button" onClick="{{ noop }}" class="au-ghost-row" style="font-family:inherit; cursor:pointer; border:1px dashed var(--border-color); border-radius:var(--radius-md); background:transparent; color:var(--active-color); font-weight:600; font-size:13.5px; min-height:90px; display:flex; align-items:center; justify-content:center; gap:8px;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>합성 프로젝트
        </button>
      </div>
    </div>
    </sc-if>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:920},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;list&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;'cards'|'list'&quot;},&quot;synthesisStatus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;available&quot;,&quot;beta&quot;,&quot;hidden&quot;],&quot;default&quot;:&quot;beta&quot;,&quot;tsType&quot;:&quot;'available'|'beta'|'hidden'&quot;},&quot;showResume&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { view: null };

  get view(){ return this.state.view || this.props.defaultView || 'cards'; }

  badge(kind){
    // 시맨틱 토큰 기반 상태 칩 — 라이트/다크 자동 정합 (currentColor 변수)
    const map = {
      published: { bg:'rgba(34,197,94,.15)',  c:'var(--color-success)', t:'발행됨' },
      draft:     { bg:'rgba(245,158,11,.18)', c:'var(--color-warning)', t:'초안' },
      review:    { bg:'var(--active-color-subtle)', c:'var(--active-color)', t:'검토중' },
      progress:  { bg:'rgba(59,130,246,.15)', c:'var(--color-info)', t:'진행중' },
      generated: { bg:'rgba(245,158,11,.18)', c:'var(--color-warning)', t:'초안 생성됨' },
    };
    return map[kind];
  }
  chip(kind){ const b=this.badge(kind); return { style:{ fontSize:'10px', fontWeight:600, borderRadius:'4px', padding:'2px 7px', letterSpacing:'.2px', background:b.bg, color:b.c }, label:b.t }; }

  renderVals(){
    const synthStatus = this.props.synthesisStatus || 'beta'; // available | beta | hidden
    const noop = (e)=>{ if(e&&e.preventDefault) e.preventDefault(); };

    const recent = [
      { name:'통합 시험 보고서', owner:'연구개발팀', date:'6/17', ...this._c('published') },
      { name:'구조 설계 기준 v2', owner:'홍길동', date:'6/16', ...this._c('draft') },
      { name:'전장전기 인터페이스 규격', owner:'김엔지니어', date:'6/14', ...this._c('review') },
    ];

    const seg = (flex, color)=>({ flex, background:color, height:'6px', borderRadius:'3px' });
    // 합성 단계칩 — 단색(브랜드 악센트) 1종. 무지개 금지.
    const stage = (label)=>({ statusLabel:label, badgeStyle:{ fontSize:'10px', fontWeight:600, borderRadius:'4px', padding:'2px 7px', letterSpacing:'.2px', background:'var(--active-color-subtle)', color:'var(--active-color)' } });
    const synth = [
      { name:'진동 시험 규격 제정', meta:'3개 소스 · 12/24 항목 선별', ...stage('선별 중'),
        sources:['MIL-STD-810G','AS9100','사내 현행'],
        segs:[ seg(4,'var(--color-success)'), seg(3,'var(--color-warning)'), seg(2,'var(--color-error)'), seg(1,'var(--text-muted)') ] },
      { name:'EMI 차폐 표준화', meta:'4개 소스 · 6/12', ...stage('초안 생성됨'),
        sources:['MIL-STD-461','DO-160G','+2'],
        segs:[ seg(5,'var(--color-success)'), seg(2,'var(--color-warning)'), seg(1,'var(--color-error)'), seg(2,'var(--text-muted)') ] },
    ];

    const isCards = this.view === 'cards';
    const segActive = { background:'var(--white)', color:'var(--text-dark)', boxShadow:'var(--shadow-sm)', fontWeight:600 };
    const segIdle = { color:'var(--text-light)', background:'transparent' };

    return {
      noop,
      toggleTheme: ()=>{ const b=document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); },
      showCards: ()=> this.setState({ view:'cards' }),
      showList:  ()=> this.setState({ view:'list' }),
      isCards, isList: !isCards,
      cardsBtnStyle: isCards ? segActive : segIdle,
      listBtnStyle:  !isCards ? segActive : segIdle,
      recent, synth,
      showResume: this.props.showResume !== false,
      synthVisible: synthStatus !== 'hidden',
      synthBeta: synthStatus === 'beta',
    };
  }

  _c(kind){ const x=this.chip(kind); return { statusLabel:x.label, badgeStyle:x.style }; }
}
</script>
</body>
</html>
