                if (diffState.currentIndex >= 0 && !isChangeVisible(diffState.currentIndex)) {
                    diffState.currentIndex = -1;
                    document.querySelectorAll('.diff-active').forEach(function(el) {
                        el.classList.remove('diff-active');
                    });
                    document.querySelectorAll('.cp-change-item.active').forEach(function(el) {
                        el.classList.remove('active');
                    });
                }

                updateNavigation();
            }

            // ══════════════════════════════════════════
            // Phase 4: 수락/거절 + 내보내기
            // ══════════════════════════════════════════

            // ── 4-1. 수락/거절 ──
            function setDecision(index, type) {
                if (editMode) return;
                if (index < 0 || index >= diffState.changes.length) return;
                // 토글: 같은 결정 재클릭 → null
                diffState.decisions[index] = diffState.decisions[index] === type ? null : type;
                updateDecisionUI(index);
                updateDecisionProgress();
            }

            function updateDecisionUI(index) {
                var decision = diffState.decisions[index];
                // 사이드바 항목
                var item = sidebarBody.querySelector('.cp-change-item[data-change-index="' + index + '"]');
                if (item) {
                    item.classList.remove('cp-decision-accepted', 'cp-decision-rejected');
                    if (decision) item.classList.add('cp-decision-' + decision);
                    var accBtn = item.querySelector('.cp-accept-btn');
                    var rejBtn = item.querySelector('.cp-reject-btn');
                    if (accBtn) accBtn.classList.toggle('active', decision === 'accepted');
                    if (rejBtn) rejBtn.classList.toggle('active', decision === 'rejected');
                }
                // 패널 하이라이트
                var panelEls = document.querySelectorAll('.cp-paragraph[data-change-index="' + index + '"]');
                panelEls.forEach(function(el) {
                    el.classList.remove('diff-decision-accepted', 'diff-decision-rejected');
                    if (decision) el.classList.add('diff-decision-' + decision);
                });
            }

            function updateDecisionProgress() {
                var total = diffState.changes.length;
                if (total === 0) return;
                var decided = 0;
                for (var i = 0; i < total; i++) {
                    if (diffState.decisions[i]) decided++;
                }
                var el = document.getElementById('cp-decision-progress');
                if (el) {
                    el.textContent = decided > 0 ? decided + '/' + total + ' 처리' : '';
                }
            }

            // 사이드바 클릭 — 수락/거절 버튼 처리
            sidebarBody.addEventListener('click', function(e) {
                // AI 요약 바 클릭 → 해당 태그만 필터 토글
                var summaryRow = e.target.closest('[data-ai-summary-tag]');
                if (summaryRow) {
                    e.stopPropagation();
                    var tag = summaryRow.getAttribute('data-ai-summary-tag');
                    // 해당 태그의 필터 체크박스 토글
                    var cb = filterDropdown.querySelector('[data-ai-filter="' + tag + '"]');
                    if (cb) {
                        cb.checked = !cb.checked;
                        diffState.aiFilter[tag] = cb.checked;
                        applyFilter();
                        // 요약 행 dimmed 토글
                        summaryRow.classList.toggle('dimmed', !cb.checked);
                    }
                    return;
                }
                // AI "분류 변경" 버튼 클릭 → HITL 드롭다운
                var retagBtn = e.target.closest('.cp-ai-retag-btn[data-ai-change]');
                if (retagBtn) {
                    e.stopPropagation();
                    var aiIdx = parseInt(retagBtn.getAttribute('data-ai-change'), 10);
                    showAiTagDropdown(aiIdx, retagBtn);
                    return;
                }

                var decBtn = e.target.closest('[data-decision]');
                if (decBtn) {
                    e.stopPropagation();
                    var idx = parseInt(decBtn.getAttribute('data-idx'), 10);
                    var type = decBtn.getAttribute('data-decision') === 'accept' ? 'accepted' : 'rejected';
                    setDecision(idx, type);
                    return;
                }
                var item = e.target.closest('[data-change-index]');
                if (!item) return;
                var idx = parseInt(item.getAttribute('data-change-index'), 10);
                navigateToChange(idx);
            });

            // 일괄 처리 (동적 생성 → 이벤트 위임)
            sidebarBody.addEventListener('click', function(e) {
                var btn = e.target.closest('#bulk-accept-btn, #bulk-reject-btn, #bulk-reset-btn');
                if (!btn) return;
                e.stopPropagation();
                var action = btn.id === 'bulk-accept-btn' ? 'accepted'
                    : btn.id === 'bulk-reject-btn' ? 'rejected' : null;
                if (action && editMode) return;
                for (var i = 0; i < diffState.changes.length; i++) {
                    diffState.decisions[i] = action;
                    updateDecisionUI(i);
                }
                updateDecisionProgress();
            });

            // ── 4-2. 내보내기 ──
            downloadBtn.addEventListener('click', function() {
                if (editMode || diffState.changes.length === 0) return;

                // 미처리 항목 확인
                var undecided = 0;
                for (var i = 0; i < diffState.decisions.length; i++) {
                    if (!diffState.decisions[i]) undecided++;
                }

                if (undecided > 0) {
                    showExportConfirm(undecided, doExport);
                } else {
                    doExport();
                }
            });

            function doExport() {
                var parasA = docState.a.paragraphs;
                var parasB = docState.b.paragraphs;
                var changes = diffState.changes;
                var decisions = diffState.decisions;

                // changeOrder를 재활용하여 원래 순서대로 병합
                var order = buildChangeOrder(changes, parasA, parasB);

                // change → decision 매핑 (changeIndex 기준)
                var decisionByChange = {};
                for (var i = 0; i < changes.length; i++) {
                    decisionByChange[i] = decisions[i];
                }

                var result = [];
                for (var k = 0; k < order.length; k++) {
                    var entry = order[k];

                    if (entry.type === 'equal') {
                        result.push(parasA[entry.iA]);
                    } else if (entry.type === 'added') {
                        var ci = entry.change._changeIndex;
                        // 수락 → B텍스트 포함, 그 외 → 무시
                        if (decisionByChange[ci] === 'accepted') {
                            result.push(parasB[entry.change.indexB]);
                        }
                    } else if (entry.type === 'deleted') {
                        var ci = entry.change._changeIndex;
                        // 수락(삭제 확정) → 건너뜀, 그 외 → A 유지
                        if (decisionByChange[ci] !== 'accepted') {
                            result.push(parasA[entry.change.indexA]);
                        }
                    } else if (entry.type === 'modified') {
                        var ci = entry.change._changeIndex;
                        // 수락 → B텍스트, 그 외 → A텍스트
                        if (decisionByChange[ci] === 'accepted') {
                            result.push(parasB[entry.change.indexB]);
                        } else {
                            result.push(parasA[entry.change.indexA]);
                        }
                    }
                }

                // AI 분류 태그가 있으면 상단 요약 추가
                var header = '';
                if (diffState.aiClassifications) {
                    header = '=== AI 의미 분류 요약 ===\n';
                    for (var ci = 0; ci < changes.length; ci++) {
                        var cls = diffState.aiClassifications[ci];
                        if (!cls) continue;
                        var effTag = cls.userOverride || cls.tag;
                        var meta = AI_TAG_META[effTag] || AI_TAG_META.UNKNOWN;
                        var cInfo = changes[ci];
                        var snippet = cInfo.summary || '';
                        if (snippet.length > 60) snippet = snippet.substring(0, 60) + '…';
                        header += '[' + effTag + '] ' + (ci + 1) + '. ' + snippet;
                        if (cls.userOverride) header += ' (사용자 수정)';
                        header += '\n';
                    }
                    header += '\n=== 본문 ===\n\n';
                }

                var text = header + result.join('\n\n');
                var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = (docState.a.filename || 'document').replace(/\.[^.]+$/, '') + '_merged.txt';
                a.click();
                URL.revokeObjectURL(url);
            }

            function showExportConfirm(undecided, onConfirm) {
                var overlay = document.createElement('div');
                overlay.className = 'modal-overlay blur';
                overlay.innerHTML = '<div class="modal-box" style="max-width:400px">'
                    + '<div class="modal-header"><h3>내보내기 확인</h3>'
                    + '<button class="modal-close" id="export-modal-close">&times;</button></div>'
                    + '<div class="modal-body">'
                    + '<p style="font-size:14px;color:var(--text-dark);margin:0">'
                    + '미처리 <strong>' + undecided + '</strong>건은 원본 텍스트로 유지됩니다.</p>'
                    + '</div>'
                    + '<div class="modal-footer">'
                    + '<button class="btn btn-secondary" id="export-modal-cancel">취소</button>'
                    + '<button class="btn btn-primary" id="export-modal-ok">내보내기</button>'
                    + '</div></div>';
                document.body.appendChild(overlay);

                function close() { overlay.remove(); }
                overlay.querySelector('#export-modal-close').addEventListener('click', close);
                overlay.querySelector('#export-modal-cancel').addEventListener('click', close);
                overlay.querySelector('#export-modal-ok').addEventListener('click', function() {
                    close();
                    onConfirm();
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) close();
                });
            }

            // ── 4-3. 단락 번호 ──
            paragraphNumBtn.addEventListener('click', function() {
                showParagraphNumbers = !showParagraphNumbers;
                paragraphNumBtn.classList.toggle('active', showParagraphNumbers);
                document.querySelectorAll('.cp-panel-body').forEach(function(panel) {
                    panel.classList.toggle('show-para-numbers', showParagraphNumbers);
                });
            });

            // ── 4-1 키보드: Enter(수락), Delete(거절) ──
            // (기존 keydown 리스너에 추가하기 위한 별도 리스너)
            document.addEventListener('keydown', function(e) {
                if (e.target.isContentEditable || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                if (editMode || currentMode !== 'compare') return;
                if (diffState.currentIndex < 0) return;

                if (e.key === 'Enter') {
                    e.preventDefault();
                    setDecision(diffState.currentIndex, 'accepted');
                } else if (e.key === 'Delete') {
                    e.preventDefault();
                    setDecision(diffState.currentIndex, 'rejected');
                }
            });

            // ══════════════════════════════════════════
            // Phase 6: AI 의미 분류
            // ══════════════════════════════════════════

            var AI_TAG_META = {
                STRICTER:      { label: '강화', group: 'attention', gutterKey: 'stricter' },
                MORE_LENIENT:  { label: '완화', group: 'attention', gutterKey: 'lenient' },
                EXPANDED:      { label: '확대', group: 'reference', gutterKey: 'expanded' },
                CLARIFICATION: { label: '명확화', group: 'reference', gutterKey: 'clarification' },
                EDITORIAL:     { label: '편집', group: 'ignorable', gutterKey: 'editorial' },
                RESTRUCTURED:  { label: '재구성', group: 'ignorable', gutterKey: 'restructured' },
                UNKNOWN:       { label: '?', group: 'ignorable', gutterKey: 'unknown' }
            };

            var aiAnalyzing = false;

            aiClassifyBtn.addEventListener('click', function() {
                if (aiAnalyzing || diffState.changes.length === 0) return;

                // 이미 분류 완료 시 재분석 확인
                if (diffState.aiClassifications) {
                    if (!confirm('이미 분석 결과가 있습니다. 다시 분석하시겠습니까?')) return;
                }

                runAiClassification();
            });

            function runAiClassification() {
                aiAnalyzing = true;
                aiClassifyBtn.disabled = true;
                aiClassifyLabel.textContent = '분석 중…';
                aiClassifyBtn.classList.add('ai-analyzing');

                // 변경 구간 데이터 구성
                var changes = [];
                for (var i = 0; i < diffState.changes.length; i++) {
                    var c = diffState.changes[i];
                    changes.push({
                        index: i,
                        type: c.type,
                        text_a: c.type !== 'added' ? docState.a.paragraphs[c.indexA] || '' : '',
                        text_b: c.type !== 'deleted' ? docState.b.paragraphs[c.indexB] || '' : ''
                    });
                }

                fetch(API_BASE + '/compare/ai-classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ changes: changes })
                })
                .then(function(r) {
                    if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || 'AI 분류 실패'); });
                    return r.json();
                })
                .then(function(data) {
                    // 분류 결과 매핑 (index 기반)
                    var cls = new Array(diffState.changes.length);
                    for (var i = 0; i < cls.length; i++) {
                        cls[i] = { tag: 'UNKNOWN', confidence: 0, explanation: '' };
                    }
                    if (data.classifications) {
                        for (var j = 0; j < data.classifications.length; j++) {
                            var item = data.classifications[j];
                            if (item.index >= 0 && item.index < cls.length) {
                                cls[item.index] = {
                                    tag: item.tag || 'UNKNOWN',
                                    confidence: item.confidence || 0,
                                    explanation: item.explanation || ''
                                };
                            }
                        }
                    }
                    diffState.aiClassifications = cls;
                    aiFilterSection.style.display = '';
                    renderSidebar(diffState.changes);
                    applyFilter();
                    showToast('AI 분석 완료 — ' + diffState.changes.length + '건 분류됨', 'success');
                })
                .catch(function(err) {
                    showToast('AI 분석 실패: ' + err.message, 'error');
                })
                .finally(function() {
                    aiAnalyzing = false;
                    aiClassifyBtn.disabled = false;
                    aiClassifyLabel.textContent = 'AI 분석';
                    aiClassifyBtn.classList.remove('ai-analyzing');
                });
            }

            // ── AI 태그 필터 ──
            filterDropdown.addEventListener('change', function(e) {
                var input = e.target;
                if (!input.dataset.aiFilter) return;
                diffState.aiFilter[input.dataset.aiFilter] = input.checked;
                applyFilter();
            });

            // "주의 필요만 보기" ↔ "전체 표시" 토글 프리셋
            var aiFilterAttentionBtn = document.getElementById('ai-filter-attention');
            var aiFilterAttentionOnly = false;
            aiFilterAttentionBtn.addEventListener('click', function() {
                aiFilterAttentionOnly = !aiFilterAttentionOnly;
                var attentionTags = ['STRICTER', 'MORE_LENIENT'];
                var cbs = filterDropdown.querySelectorAll('[data-ai-filter]');
                for (var i = 0; i < cbs.length; i++) {
                    var tag = cbs[i].dataset.aiFilter;
                    cbs[i].checked = aiFilterAttentionOnly ? attentionTags.indexOf(tag) >= 0 : true;
                    diffState.aiFilter[tag] = cbs[i].checked;
                }
                aiFilterAttentionBtn.textContent = aiFilterAttentionOnly ? '전체 표시' : '주의 필요만 보기';
                aiFilterAttentionBtn.classList.toggle('active', aiFilterAttentionOnly);
                applyFilter();
            });

            // ── AI HITL: "분류 변경" 버튼 → 태그 변경 드롭다운 ──
            var activeAiDropdown = null;   // { el, closeFn }
            function dismissAiDropdown() {
                if (!activeAiDropdown) return;
                activeAiDropdown.el.remove();
                document.removeEventListener('click', activeAiDropdown.closeFn);
                activeAiDropdown = null;
            }

            function showAiTagDropdown(changeIdx, anchorEl) {
                dismissAiDropdown();

                var cls = diffState.aiClassifications[changeIdx];
                var currentTag = cls.userOverride || cls.tag;

                var dd = document.createElement('div');
                dd.className = 'cp-ai-tag-dropdown';
                var tags = ['STRICTER', 'MORE_LENIENT', 'EXPANDED', 'CLARIFICATION', 'EDITORIAL', 'RESTRUCTURED'];
                for (var i = 0; i < tags.length; i++) {
                    var t = tags[i];
                    var meta = AI_TAG_META[t];
                    var opt = document.createElement('button');
                    opt.className = 'cp-ai-tag-option cp-ai-dt-' + meta.gutterKey + (t === currentTag ? ' cp-ai-tag-current' : '');
                    opt.textContent = (t === currentTag ? '● ' : '') + meta.label;
                    opt.dataset.tag = t;
                    dd.appendChild(opt);
                }

                dd.addEventListener('click', function(e) {
                    var opt = e.target.closest('[data-tag]');
                    if (!opt) return;
                    var newTag = opt.dataset.tag;
                    cls.userOverride = newTag;
                    // 전체 사이드바 리렌더 (거터 + 상세 + 요약 갱신)
                    renderSidebar(diffState.changes);
                    applyFilter();
                    dismissAiDropdown();
                });

                // 위치 — 앵커 아래
                var rect = anchorEl.getBoundingClientRect();
                dd.style.position = 'fixed';
                dd.style.left = rect.left + 'px';
                dd.style.top = (rect.bottom + 4) + 'px';
                dd.style.zIndex = '3100';
                document.body.appendChild(dd);

                // 외부 클릭 닫기
                var closeFn = function(e) {
                    if (!dd.contains(e.target) && e.target !== anchorEl) {
                        dismissAiDropdown();
                    }
                };
                activeAiDropdown = { el: dd, closeFn: closeFn };
                setTimeout(function() {
                    document.addEventListener('click', closeFn);
                }, 0);
            }

            // ══════════════════════════════════════════
            // Phase 3: 검증 모드 (Validation Mode)
            // ══════════════════════════════════════════

            // ── 검증 상태 ──
            var validateState = {
                score: -1,
                summary: { error: 0, warning: 0, suggestion: 0 },
                issues: [],
                currentIndex: -1,
                filter: { error: true, warning: true, suggestion: true },
                isLoading: false
            };

            // ── 검증 DOM 참조 ──
            var vdNavGroup = document.getElementById('vd-nav-group');
            var vdNavPrev = document.getElementById('vd-nav-prev');
            var vdNavNext = document.getElementById('vd-nav-next');
            var vdNavIndicator = document.getElementById('vd-nav-indicator');
            var vdFilterGroup = document.getElementById('vd-filter-group');
            var vdFilterBtn = document.getElementById('vd-filter-btn');
            var vdFilterDropdown = document.getElementById('vd-filter-dropdown');
            var vdSettingsBtn = document.getElementById('vd-settings-btn');
            var vdRevalidateBtn = document.getElementById('vd-revalidate-btn');

            // ── 3-1. 검증 실행 ──
            function tryRunValidation() {
                if (currentMode !== 'verify') return;
                if (docState.a.paragraphs.length > 0) {
                    runValidation();
                }
            }

            function runValidation() {
                validateState.isLoading = true;
                validateState.currentIndex = -1;

                // 사이드바에 로딩 표시
                sidebarBody.innerHTML = '<div class="vd-loading">'
                    + '<div class="spinner cp-upload-spinner"></div>'
                    + '<span>검증 중...</span></div>';

                fetch(API_BASE + '/compare/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        paragraphs: docState.a.paragraphs,
                        preset: null
                    })
                })
                .then(function(res) {
                    if (!res.ok) {
                        return res.json().then(function(err) {
                            throw new Error(err.detail || '검증 실패');
                        });
                    }
                    return res.json();
                })
                .then(function(data) {
                    validateState.score = data.score;
                    validateState.summary = data.summary;
                    validateState.issues = data.issues;
                    validateState.isLoading = false;

                    renderValidationHighlights(data.issues);
                    renderValidationSidebar();
                    showValidationUI(true);
                    updateValidationNavigation();
                })
                .catch(function(err) {
                    validateState.isLoading = false;
                    sidebarBody.innerHTML = '<div class="cp-sidebar-empty" style="color:var(--color-error)">'
                        + '검증 오류: ' + escapeHTML(err.message) + '</div>';
                });
            }

            function clearValidation() {
                validateState.score = -1;
                validateState.summary = { error: 0, warning: 0, suggestion: 0 };
                validateState.issues = [];
                validateState.currentIndex = -1;
                validateState.isLoading = false;

                // 인라인 하이라이트 제거: 원래 텍스트로 복원
                if (docState.a.paragraphs.length > 0) {
                    renderParagraphs(panelBodyA, docState.a.paragraphs);
                }

                showValidationUI(false);

                // 사이드바 빈 상태
                if (currentMode === 'verify') {
                    sidebarBody.innerHTML = '<div class="cp-sidebar-empty" id="cp-sidebar-empty">검증 결과가 여기에 표시됩니다</div>';
                }
            }

            function showValidationUI(show) {
                vdNavGroup.style.display = show ? '' : 'none';
                vdFilterGroup.style.display = show ? '' : 'none';
                paragraphNumBtn.style.display = show ? '' : 'none';
            }

            // ── 3-2. 인라인 하이라이트 렌더링 ──
            function renderValidationHighlights(issues) {
                if (!issues || issues.length === 0) return;

                // 단락별 이슈 그룹화
                var byParagraph = {};
                for (var i = 0; i < issues.length; i++) {
                    var iss = issues[i];
                    var pi = iss.paragraph_index;
                    if (!byParagraph[pi]) byParagraph[pi] = [];
                    byParagraph[pi].push({ issue: iss, globalIndex: i });
                }

                // Panel A의 각 단락에 마크 삽입
                var content = panelBodyA.querySelector('.cp-text-content');
                if (!content) return;

                var paragraphEls = content.querySelectorAll('.cp-paragraph');

                for (var pi in byParagraph) {
                    var pIdx = parseInt(pi, 10);
                    if (pIdx >= paragraphEls.length) continue;

                    var el = paragraphEls[pIdx];
                    var text = docState.a.paragraphs[pIdx];
                    if (!text) continue;

                    // 이슈를 span 길이 오름차순 정렬 (짧은 이슈 우선 → 긴 문장길이 이슈는 뒤로)
                    var pIssues = byParagraph[pi].slice().sort(function(a, b) {
                        var lenA = a.issue.char_end - a.issue.char_start;
                        var lenB = b.issue.char_end - b.issue.char_start;
                        return lenA - lenB;
                    });

                    // 점유 맵: 각 문자 위치를 차지한 이슈 (짧은 이슈 우선)
                    var charMap = [];  // charMap[pos] = { gIdx, severity, message }
                    for (var j = 0; j < pIssues.length; j++) {
                        var iss = pIssues[j].issue;
                        var gIdx = pIssues[j].globalIndex;
                        for (var c = iss.char_start; c < iss.char_end; c++) {
                            if (!charMap[c]) {
                                charMap[c] = { gIdx: gIdx, severity: iss.severity, message: iss.message };
                            }
                        }
                    }

                    // 연속 구간을 span으로 변환
                    var html = '';
                    var pos = 0;
                    while (pos < text.length) {
                        if (charMap[pos]) {
                            var cur = charMap[pos];
                            var spanStart = pos;
                            while (pos < text.length && charMap[pos] && charMap[pos].gIdx === cur.gIdx) {
                                pos++;
                            }
                            var hidden = !validateState.filter[cur.severity] ? ' vd-mark-hidden' : '';
                            html += '<span class="validate-mark severity-' + cur.severity + hidden
                                + '" data-issue-index="' + cur.gIdx + '"'
                                + ' title="' + escapeHTML(cur.message) + '">'
                                + escapeHTML(text.substring(spanStart, pos))
                                + '</span>';
                        } else {
                            var plainStart = pos;
                            while (pos < text.length && !charMap[pos]) {
                                pos++;
                            }
                            html += escapeHTML(text.substring(plainStart, pos));
                        }
                    }

                    el.innerHTML = html;
                }

            }

            // ── 3-2. 검증 사이드바 렌더링 ──
            function renderValidationSidebar() {
                var issues = validateState.issues;
                var score = validateState.score;
                var summary = validateState.summary;

                if (issues.length === 0) {
                    sidebarBody.innerHTML = '<div class="cp-sidebar-empty">'
                        + (docState.a.paragraphs.length > 0 ? '이슈가 없습니다' : '검증 결과가 여기에 표시됩니다')
                        + '</div>';
                    return;
                }

                // 스코어 색상 — CSS 변수에서 런타임 읽기 (다크 모드 대응)
                var cs = getComputedStyle(document.documentElement);
                var colorGood = cs.getPropertyValue('--color-success').trim() || '#22c55e';
                var colorWarn = cs.getPropertyValue('--color-warning').trim() || '#f59e0b';
                var colorBad = cs.getPropertyValue('--color-error').trim() || '#ef4444';
                var scoreColor = score >= 90 ? colorGood : (score >= 70 ? colorWarn : colorBad);
                var scoreBg = score >= 90 ? 'rgba(34,197,94,0.1)' : (score >= 70 ? 'rgba(245,158,11,0.1)' : 'rgba(239,68,68,0.1)');

                // SVG 도넛 링
                var circumference = 2 * Math.PI * 14;
                var offset = circumference - (score / 100) * circumference;

                var html = '<div class="vd-score-card" style="background:' + scoreBg + '">'
                    + '<svg class="vd-score-ring" width="40" height="40" viewBox="0 0 36 36">'
                    + '<circle cx="18" cy="18" r="14" fill="none" stroke="' + scoreColor + '" stroke-opacity="0.2" stroke-width="3"/>'
                    + '<circle cx="18" cy="18" r="14" fill="none" stroke="' + scoreColor + '" stroke-width="3" stroke-linecap="round"'
                    + ' stroke-dasharray="' + circumference.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"'
                    + ' transform="rotate(-90 18 18)"/>'
                    + '<text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="' + scoreColor + '">' + score + '</text>'
                    + '</svg>'
                    + '<div class="vd-score-details">';

                if (summary.error > 0) html += '<span class="vd-score-stat stat-error">오류 ' + summary.error + '</span>';
                if (summary.warning > 0) html += '<span class="vd-score-stat stat-warning">경고 ' + summary.warning + '</span>';
                if (summary.suggestion > 0) html += '<span class="vd-score-stat stat-suggestion">제안 ' + summary.suggestion + '</span>';

                html += '</div></div>';

                // 카테고리별 그룹화
                var categories = {};
                var categoryLabels = { structure: '구조', terminology: '용어', readability: '가독성' };
                var categoryOrder = ['structure', 'terminology', 'readability'];

                for (var i = 0; i < issues.length; i++) {
                    var cat = issues[i].category || 'etc';
                    if (!categories[cat]) categories[cat] = [];
                    categories[cat].push({ issue: issues[i], globalIndex: i });
                }

                var totalIssues = issues.length;
                var firstCategory = true;

                for (var ci = 0; ci < categoryOrder.length; ci++) {
                    var cat = categoryOrder[ci];
                    if (!categories[cat]) continue;
                    var catIssues = categories[cat];
                    var collapsed = totalIssues >= 15 && !firstCategory;

                    html += '<div class="vd-category' + (collapsed ? ' collapsed' : '') + '" data-vd-category="' + cat + '">'
                        + '<div class="vd-category-header">'
                        + '<span class="vd-category-arrow">&#9660;</span> '
                        + (categoryLabels[cat] || cat)
                        + ' <span class="vd-category-count">(' + catIssues.length + ')</span>'
                        + '</div>'
                        + '<div class="vd-category-body">';

                    for (var j = 0; j < catIssues.length; j++) {
                        var iss = catIssues[j].issue;
                        var gIdx = catIssues[j].globalIndex;
                        var sevLabel = iss.severity === 'error' ? '오류' : (iss.severity === 'warning' ? '경고' : '제안');
                        var hidden = !validateState.filter[iss.severity] ? ' vd-issue-hidden' : '';

                        html += '<div class="vd-issue-item severity-' + iss.severity + hidden + '" data-vd-issue-index="' + gIdx + '">'
                            + '<span class="vd-issue-badge">' + sevLabel + '</span>'
                            + '<span class="vd-issue-text">' + escapeHTML(iss.message) + '</span>'
                            + '</div>';
                    }

                    html += '</div></div>';
                    firstCategory = false;
                }

                sidebarBody.innerHTML = html;

                // 카테고리 접기/펼치기 이벤트
                sidebarBody.querySelectorAll('.vd-category-header').forEach(function(header) {
                    header.addEventListener('click', function() {
                        header.parentElement.classList.toggle('collapsed');
                    });
                });
            }

            // 사이드바 이슈 클릭 이벤트 위임
            sidebarBody.addEventListener('click', function(e) {
                var item = e.target.closest('[data-vd-issue-index]');
                if (!item) return;
                var idx = parseInt(item.getAttribute('data-vd-issue-index'), 10);
                if (!isNaN(idx)) {
                    vdNavigateToIssue(idx);
                }
            });

            // ── 3-4. 이슈 네비게이션 ──
            function getVdFilteredIndices() {
                var indices = [];
                for (var i = 0; i < validateState.issues.length; i++) {
                    if (validateState.filter[validateState.issues[i].severity]) {
                        indices.push(i);
                    }
                }
                return indices;
            }

            function updateValidationNavigation() {
                var filtered = getVdFilteredIndices();
                var total = filtered.length;

                if (total === 0) {
                    vdNavIndicator.textContent = '0/0';
                    vdNavPrev.disabled = true;
                    vdNavNext.disabled = true;
                    return;
                }

                var pos = 0;
                if (validateState.currentIndex >= 0) {
                    pos = filtered.indexOf(validateState.currentIndex);
                    if (pos < 0) pos = 0;
                }

                vdNavIndicator.textContent = (validateState.currentIndex >= 0 ? (pos + 1) : 0) + '/' + total;
                vdNavPrev.disabled = pos <= 0 || validateState.currentIndex < 0;
                vdNavNext.disabled = pos >= total - 1 && validateState.currentIndex >= 0;
            }

            function vdNavigateToIssue(index) {
                if (index < 0 || index >= validateState.issues.length) return;

                // 이전 활성 해제
                document.querySelectorAll('.validate-active').forEach(function(el) {
                    el.classList.remove('validate-active');
                });
                document.querySelectorAll('.vd-issue-item.active').forEach(function(el) {
                    el.classList.remove('active');
                });

                validateState.currentIndex = index;

                // 인라인 mark 활성화 + 스크롤
                var mark = panelBodyA.querySelector('.validate-mark[data-issue-index="' + index + '"]');
                if (mark) {
                    mark.classList.add('validate-active');
                    // panelBodyA 기준 상대 오프셋 계산 후 중앙 스크롤
                    var markRect = mark.getBoundingClientRect();
                    var panelRect = panelBodyA.getBoundingClientRect();
                    var elTop = markRect.top - panelRect.top + panelBodyA.scrollTop;
                    var panelH = panelBodyA.clientHeight;
                    var desiredTop = elTop - (panelH / 2) + (mark.offsetHeight / 2);
                    desiredTop = Math.max(0, Math.min(desiredTop, panelBodyA.scrollHeight - panelH));
                    panelBodyA.scrollTop = desiredTop;
                }

                // 사이드바 항목 활성화 + 스크롤
                var sidebarItem = sidebarBody.querySelector('.vd-issue-item[data-vd-issue-index="' + index + '"]');
                if (sidebarItem) {
                    sidebarItem.classList.add('active');
                    sidebarItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                    // 카테고리가 접혀 있으면 펼치기
                    var category = sidebarItem.closest('.vd-category');
                    if (category && category.classList.contains('collapsed')) {
                        category.classList.remove('collapsed');
                    }
                }

                updateValidationNavigation();
            }

            function vdNavigatePrev() {
                var filtered = getVdFilteredIndices();
                if (filtered.length === 0) return;
                var pos = filtered.indexOf(validateState.currentIndex);
                if (pos > 0) {
                    vdNavigateToIssue(filtered[pos - 1]);
                } else if (validateState.currentIndex < 0) {
                    vdNavigateToIssue(filtered[0]);
                }
            }

            function vdNavigateNext() {
                var filtered = getVdFilteredIndices();
                if (filtered.length === 0) return;
                var pos = filtered.indexOf(validateState.currentIndex);
                if (pos < 0) {
                    vdNavigateToIssue(filtered[0]);
                } else if (pos < filtered.length - 1) {
                    vdNavigateToIssue(filtered[pos + 1]);
                }
            }

            vdNavPrev.addEventListener('click', vdNavigatePrev);
            vdNavNext.addEventListener('click', vdNavigateNext);

            // 인라인 mark 클릭: panelBodyA 레벨 이벤트 위임 (리스너 누적 방지)
            panelBodyA.addEventListener('click', function(e) {
                var mark = e.target.closest('.validate-mark');
                if (!mark) return;
                var idx = parseInt(mark.getAttribute('data-issue-index'), 10);
                if (!isNaN(idx)) {
                    vdNavigateToIssue(idx);
                }
            });

            // ── 검증 필터 ──
            vdFilterBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                var isVisible = vdFilterDropdown.style.display !== 'none';
                vdFilterDropdown.style.display = isVisible ? 'none' : '';
                vdFilterBtn.classList.toggle('active', !isVisible);
            });

            document.addEventListener('click', function(e) {
                if (!vdFilterGroup.contains(e.target)) {
                    vdFilterDropdown.style.display = 'none';
                    vdFilterBtn.classList.remove('active');
                }
            });

            vdFilterDropdown.addEventListener('change', function(e) {
                var input = e.target;
                var filterType = input.getAttribute('data-vd-filter');
                if (!filterType) return;
                validateState.filter[filterType] = input.checked;
                applyValidationFilter();
            });

            function applyValidationFilter() {
                // 인라인 마크 토글 (CSS 클래스로 제어)
                var marks = panelBodyA.querySelectorAll('.validate-mark');
                marks.forEach(function(mark) {
                    var idx = parseInt(mark.getAttribute('data-issue-index'), 10);
                    var iss = validateState.issues[idx];
                    if (iss) {
                        mark.classList.toggle('vd-mark-hidden', !validateState.filter[iss.severity]);
                    }
                });

                // 사이드바 항목 토글
                var items = sidebarBody.querySelectorAll('.vd-issue-item');
                items.forEach(function(item) {
                    var idx = parseInt(item.getAttribute('data-vd-issue-index'), 10);
                    var iss = validateState.issues[idx];
                    if (iss) {
                        item.classList.toggle('vd-issue-hidden', !validateState.filter[iss.severity]);
                    }
                });

                // 현재 인덱스가 필터 밖이면 리셋
                if (validateState.currentIndex >= 0 && !validateState.filter[validateState.issues[validateState.currentIndex].severity]) {
                    validateState.currentIndex = -1;
                    document.querySelectorAll('.validate-active').forEach(function(el) {
                        el.classList.remove('validate-active');
                    });
                    document.querySelectorAll('.vd-issue-item.active').forEach(function(el) {
                        el.classList.remove('active');
                    });
                }

                updateValidationNavigation();
            }

            // ── 재검증 버튼 ──
            vdRevalidateBtn.addEventListener('click', function() {
                if (docState.a.paragraphs.length > 0) {
                    runValidation();
                }
            });

            // ── 3-3. 규칙 설정 모달 ──
            var RULE_LABELS = {
                numbering_continuity: '번호 체계 연속성',
                table_caption: '표 캡션 존재',
                figure_caption: '그림 캡션 존재',
                forbidden_terms: '금지 용어 감지',
                inconsistent_terms: '용어 일관성',
                sentence_length: '문장 길이 제한'
            };

            var RULE_CATEGORIES = {
                numbering_continuity: '구조 검사',
                table_caption: '구조 검사',
                figure_caption: '구조 검사',
                forbidden_terms: '용어 검사',
                inconsistent_terms: '용어 검사',
                sentence_length: '가독성 검사'
            };

            var RULE_DESCRIPTIONS = {
                numbering_continuity: '단락 번호가 1.1 → 1.3처럼 건너뛰거나, 2.1 다음에 1.1이 오는 등 번호 체계가 끊기면 오류로 표시합니다.',
                table_caption: '표(Table) 위에 "표 N." 형식의 캡션이 없으면 경고합니다.',
                figure_caption: '그림(Figure) 아래에 "그림 N." 형식의 캡션이 없으면 경고합니다.',
                forbidden_terms: '아래 등록된 금지 용어가 문서에 사용되면 대체어와 함께 표시합니다. 예: "비행기" → "항공기"',
                inconsistent_terms: '같은 의미의 용어가 문서 내에서 혼용되면 가장 많이 쓰인 용어로 통일을 권장합니다. 예: "서버"와 "Server" 혼용',
                sentence_length: '설정한 글자 수를 초과하는 문장을 표시합니다. 기술문서는 80자 이내 권장.'
            };

            var SEVERITY_LABELS = { error: '오류', warning: '경고', suggestion: '제안' };

            // ── 5-1 CSV 템플릿 ──
            var CSV_TEMPLATE_FORBIDDEN = 'term,replacement\n비행기,항공기\n체크,점검\n';
            var CSV_TEMPLATE_GROUPS = 'group_name,term1,term2,term3\n항공기,비행기,비행체\n시험,테스트,test\n';

            // ── 5-1 CSV 파싱 유틸 ──
            function parseCSV(text) {
                var lines = text.split(/\r?\n/);
                var rows = [];
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (!line) continue;
                    rows.push(line.split(',').map(function(c) { return c.trim(); }));
                }
                return rows;
            }

            function detectHeaderRow(rows, type) {
                if (rows.length === 0) return false;
                var first = rows[0];
                if (type === 'forbidden') {
                    // term/replacement 또는 금지어/대체어 같은 헤더 감지
                    var headerWords = ['term', 'replacement', '용어', '금지어', '대체어', '원어', '교체'];
                    return first.some(function(c) {
                        return headerWords.indexOf(c.toLowerCase()) !== -1;
                    });
                } else {
                    var headerWords = ['group', 'name', '그룹', '그룹명'];
                    return first.some(function(c) {
                        return headerWords.indexOf(c.toLowerCase()) !== -1;
                    });
                }
            }

            vdSettingsBtn.addEventListener('click', function() {
                openRulesModal();
            });

            function openRulesModal() {
                // 서버에서 규칙 로드
                fetch(API_BASE + '/compare/rules', { credentials: 'include' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    showRulesModal(data);
                })
                .catch(function(err) {
                    showToast('규칙 로드 실패: ' + err.message, 'error');
                });
            }

            function showRulesModal(rulesData) {
                var overlay = document.createElement('div');
                overlay.className = 'vd-modal-overlay';

                var presets = rulesData.presets || {};
                var activePreset = rulesData.active_preset || 'technical';
                var currentRules = JSON.parse(JSON.stringify(presets[activePreset] || {}));

                function buildBody() {
                    var rules = currentRules.rules || {};

                    // 카테고리별 그룹화
                    var groups = {};
                    var groupOrder = ['구조 검사', '용어 검사', '가독성 검사'];
                    for (var ruleId in RULE_LABELS) {
                        var cat = RULE_CATEGORIES[ruleId];
                        if (!groups[cat]) groups[cat] = [];
                        groups[cat].push(ruleId);
                    }

                    var html = '';
                    for (var gi = 0; gi < groupOrder.length; gi++) {
                        var groupName = groupOrder[gi];
                        var ruleIds = groups[groupName];
                        if (!ruleIds) continue;

                        html += '<div class="vd-rule-group">'
                            + '<div class="vd-rule-group-title">' + groupName + '</div>';

                        for (var ri = 0; ri < ruleIds.length; ri++) {
                            var ruleId = ruleIds[ri];
                            var rule = rules[ruleId] || { enabled: false, severity: 'warning' };

                            html += '<div class="vd-rule-row" data-rule-id="' + ruleId + '">'
                                + '<span class="vd-rule-name">' + RULE_LABELS[ruleId]
                                + '<span class="tooltip-icon" data-tooltip="' + escapeHTML(RULE_DESCRIPTIONS[ruleId] || '') + '">ⓘ</span>'
                                + '</span>'
                                + '<select class="form-select form-select-sm vd-rule-severity" data-rule-severity="' + ruleId + '">'
                                + '<option value="error"' + (rule.severity === 'error' ? ' selected' : '') + '>오류</option>'
                                + '<option value="warning"' + (rule.severity === 'warning' ? ' selected' : '') + '>경고</option>'
                                + '<option value="suggestion"' + (rule.severity === 'suggestion' ? ' selected' : '') + '>제안</option>'
                                + '</select>'
                                + '<button class="vd-rule-toggle' + (rule.enabled ? ' on' : '') + '" data-rule-toggle="' + ruleId + '"></button>'
                                + '</div>';

                            // 파라미터 표시
                            if (ruleId === 'sentence_length' && rule.params) {
                                html += '<div class="vd-rule-param">'
                                    + '최대 <input type="number" class="form-input form-input-sm" data-rule-param="sentence_length.max_chars" value="' + (rule.params.max_chars || 80) + '"> 자'
                                    + '</div>';
                            }

                            // 금지 용어 편집 패널
                            if (ruleId === 'forbidden_terms') {
                                var terms = (rule.params && rule.params.terms) || [];
                                html += '<div class="vd-terms-panel" data-terms-for="forbidden_terms">';
                                html += '<div class="vd-terms-list">';
                                if (terms.length === 0) {
                                    html += '<div class="vd-terms-empty">등록된 금지 용어가 없습니다</div>';
                                } else {
                                    for (var ti = 0; ti < terms.length; ti++) {
                                        html += '<div class="vd-term-row" data-term-index="' + ti + '">'
                                            + '<span class="vd-term-text">' + escapeHTML(terms[ti].term) + '</span>'
                                            + '<span class="vd-term-arrow">&rarr;</span>'
                                            + '<span class="vd-term-replacement">' + escapeHTML(terms[ti].replacement) + '</span>'
                                            + '<button class="vd-term-remove" data-remove-term="' + ti + '" title="삭제">&times;</button>'
                                            + '</div>';
                                    }
                                }
                                html += '</div>';
                                html += '<div class="vd-term-add">'
                                    + '<input type="text" class="form-input form-input-sm" placeholder="금지어" data-add-forbidden-term>'
                                    + '<span class="vd-term-arrow">&rarr;</span>'
                                    + '<input type="text" class="form-input form-input-sm" placeholder="대체어" data-add-forbidden-replacement>'
                                    + '<button class="vd-term-add-btn" data-add-forbidden-btn title="추가">+</button>'
                                    + '</div>';
                                html += '<div class="vd-csv-actions">'
                                    + '<button class="vd-csv-btn" data-csv-import="forbidden" title="CSV 파일에서 금지 용어를 일괄 가져옵니다">'
                                    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
                                    + 'CSV 가져오기</button>'
                                    + '<input type="file" accept=".csv" data-csv-file="forbidden" style="display:none">'
                                    + '<span class="vd-csv-sample-link" data-csv-template="forbidden">템플릿 다운로드</span>'
                                    + '</div>';
                                html += '<div class="vd-csv-preview-area" data-preview-for="forbidden"></div>';
                                html += '</div>';
                            }

                            // 용어 일관성 그룹 편집 패널
                            if (ruleId === 'inconsistent_terms') {
                                var groups = (rule.params && rule.params.groups) || [];
                                html += '<div class="vd-terms-panel" data-terms-for="inconsistent_terms">';
                                html += '<div class="vd-terms-list">';
                                if (groups.length === 0) {
                                    html += '<div class="vd-terms-empty">등록된 용어 그룹이 없습니다</div>';
                                } else {
                                    for (var gi2 = 0; gi2 < groups.length; gi2++) {
                                        html += '<div class="vd-term-row" data-group-index="' + gi2 + '">'
                                            + '<div class="vd-group-tags">';
                                        for (var gti = 0; gti < groups[gi2].length; gti++) {
                                            html += '<span class="vd-group-tag">' + escapeHTML(groups[gi2][gti]) + '</span>';
                                        }
                                        html += '</div>'
                                            + '<button class="vd-term-remove" data-remove-group="' + gi2 + '" title="삭제">&times;</button>'
                                            + '</div>';
                                    }
                                }
                                html += '</div>';
                                html += '<div class="vd-term-add">'
                                    + '<input type="text" class="form-input form-input-sm" placeholder="쉼표로 구분 (예: 항공기, 비행기)" data-add-group-input style="flex:3">'
                                    + '<button class="vd-term-add-btn" data-add-group-btn title="추가">+</button>'
                                    + '</div>';
                                html += '<div class="vd-csv-actions">'
                                    + '<button class="vd-csv-btn" data-csv-import="groups" title="CSV 파일에서 용어 그룹을 일괄 가져옵니다">'
                                    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
                                    + 'CSV 가져오기</button>'
                                    + '<input type="file" accept=".csv" data-csv-file="groups" style="display:none">'
                                    + '<span class="vd-csv-sample-link" data-csv-template="groups">템플릿 다운로드</span>'
                                    + '</div>';
                                html += '<div class="vd-csv-preview-area" data-preview-for="groups"></div>';
                                html += '</div>';
                            }
                        }
                        html += '</div>';
                    }
                    return html;
                }

                var modalHTML = '<div class="vd-modal">'
                    + '<div class="vd-modal-header"><span>검증 규칙 설정</span>'
                    + '<div class="vd-modal-header-actions">'
                    + '<button class="vd-header-btn" id="vd-json-export" title="규칙 세트 내보내기 (JSON)">'
                    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>'
                    + '<button class="vd-header-btn" id="vd-json-import" title="규칙 세트 가져오기 (JSON)">'
                    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>'
                    + '<input type="file" accept=".json" id="vd-json-file" style="display:none">'
                    + '</div>'
                    + '<button class="vd-modal-close">&times;</button></div>'
                    + '<div class="vd-modal-body">'
                    + '<div class="vd-preset-row">'
                    + '<span>프리셋:</span>'
                    + '<select class="form-select form-select-sm vd-preset-select" id="vd-preset-select">';

                for (var pKey in presets) {
                    modalHTML += '<option value="' + pKey + '"' + (pKey === activePreset ? ' selected' : '') + '>'
                        + escapeHTML(presets[pKey].label || pKey) + '</option>';
                }

                modalHTML += '</select></div>'
                    + '<div id="vd-rules-body">' + buildBody() + '</div>'
                    + '</div>'
                    + '<div class="vd-modal-footer">'
                    + '<button class="vd-modal-btn" id="vd-modal-cancel">취소</button>'
                    + '<button class="vd-modal-btn primary" id="vd-modal-apply">적용 + 재검증</button>'
                    + '</div></div>';

                overlay.innerHTML = modalHTML;
                document.body.appendChild(overlay);

                // 이벤트
                var modal = overlay.querySelector('.vd-modal');
                var presetSelect = overlay.querySelector('#vd-preset-select');
                var rulesBody = overlay.querySelector('#vd-rules-body');

                function closeModal() {
                    overlay.remove();
                }

                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) closeModal();
                });
                overlay.querySelector('.vd-modal-close').addEventListener('click', closeModal);
                overlay.querySelector('#vd-modal-cancel').addEventListener('click', closeModal);

                // ESC 닫기
                function onEsc(e) {
                    if (e.key === 'Escape') closeModal();
                }
                document.addEventListener('keydown', onEsc);
                var origClose = closeModal;
                closeModal = function() {
                    document.removeEventListener('keydown', onEsc);
                    origClose();
                };

                // 프리셋 변경
                presetSelect.addEventListener('change', function() {
                    activePreset = presetSelect.value;
                    currentRules = JSON.parse(JSON.stringify(presets[activePreset] || {}));
                    rulesBody.innerHTML = buildBody();
                    bindRuleEvents();
                });

                function bindRuleEvents() {
                    // 토글 버튼
                    rulesBody.querySelectorAll('.vd-rule-toggle').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var ruleId = btn.getAttribute('data-rule-toggle');
                            btn.classList.toggle('on');
                            if (currentRules.rules && currentRules.rules[ruleId]) {
                                currentRules.rules[ruleId].enabled = btn.classList.contains('on');
                            }
                        });
                    });

                    // 심각도 변경
                    rulesBody.querySelectorAll('.vd-rule-severity').forEach(function(sel) {
                        sel.addEventListener('change', function() {
                            var ruleId = sel.getAttribute('data-rule-severity');
                            if (currentRules.rules && currentRules.rules[ruleId]) {
                                currentRules.rules[ruleId].severity = sel.value;
                            }
                        });
                    });

                    // 파라미터 변경
                    rulesBody.querySelectorAll('[data-rule-param]').forEach(function(input) {
                        input.addEventListener('change', function() {
                            var parts = input.getAttribute('data-rule-param').split('.');
                            var ruleId = parts[0];
                            var paramKey = parts[1];
                            if (currentRules.rules && currentRules.rules[ruleId] && currentRules.rules[ruleId].params) {
                                currentRules.rules[ruleId].params[paramKey] = parseInt(input.value, 10) || 80;
                            }
                        });
                    });

                    // ── 금지 용어 편집 ──
                    // 삭제
                    rulesBody.querySelectorAll('[data-remove-term]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var idx = parseInt(btn.getAttribute('data-remove-term'), 10);
                            var rule = currentRules.rules && currentRules.rules.forbidden_terms;
                            if (rule && rule.params && rule.params.terms) {
                                rule.params.terms.splice(idx, 1);
                                rebuildAndBind();
                            }
                        });
                    });

                    // 추가
                    var addForbiddenBtn = rulesBody.querySelector('[data-add-forbidden-btn]');
                    if (addForbiddenBtn) {
                        var termInput = rulesBody.querySelector('[data-add-forbidden-term]');
                        var replInput = rulesBody.querySelector('[data-add-forbidden-replacement]');

                        function addForbiddenTerm() {
                            var term = termInput.value.trim();
                            var repl = replInput.value.trim();
                            if (!term) { termInput.focus(); return; }
                            if (!repl) { replInput.focus(); return; }
                            var rule = currentRules.rules && currentRules.rules.forbidden_terms;
                            if (rule) {
                                if (!rule.params) rule.params = { terms: [] };
                                if (!rule.params.terms) rule.params.terms = [];
                                // 중복 검사
                                var exists = rule.params.terms.some(function(t) { return t.term === term; });
                                if (exists) { termInput.focus(); termInput.select(); return; }
                                rule.params.terms.push({ term: term, replacement: repl });
                                rebuildAndBind();
                            }
                        }

                        addForbiddenBtn.addEventListener('click', addForbiddenTerm);
                        // Enter 키로 추가
                        [termInput, replInput].forEach(function(inp) {
                            inp.addEventListener('keydown', function(e) {
                                if (e.key === 'Enter') { e.preventDefault(); addForbiddenTerm(); }
                            });
                        });
                    }

                    // ── 용어 그룹 편집 ──
                    // 삭제
                    rulesBody.querySelectorAll('[data-remove-group]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var idx = parseInt(btn.getAttribute('data-remove-group'), 10);
                            var rule = currentRules.rules && currentRules.rules.inconsistent_terms;
                            if (rule && rule.params && rule.params.groups) {
                                rule.params.groups.splice(idx, 1);
                                rebuildAndBind();
                            }
                        });
                    });

                    // 추가
                    var addGroupBtn = rulesBody.querySelector('[data-add-group-btn]');
                    if (addGroupBtn) {
                        var groupInput = rulesBody.querySelector('[data-add-group-input]');

                        function addTermGroup() {
                            var raw = groupInput.value.trim();
                            if (!raw) { groupInput.focus(); return; }
                            var terms = raw.split(/[,，]/).map(function(t) { return t.trim(); }).filter(Boolean);
                            if (terms.length < 2) { groupInput.focus(); return; }
                            var rule = currentRules.rules && currentRules.rules.inconsistent_terms;
                            if (rule) {
                                if (!rule.params) rule.params = { groups: [] };
                                if (!rule.params.groups) rule.params.groups = [];
                                rule.params.groups.push(terms);
                                rebuildAndBind();
                            }
                        }

                        addGroupBtn.addEventListener('click', addTermGroup);
                        groupInput.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') { e.preventDefault(); addTermGroup(); }
                        });
                    }

                    // ── 5-1. CSV 가져오기 ──
                    rulesBody.querySelectorAll('[data-csv-import]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var type = btn.getAttribute('data-csv-import');
                            var fileInput = rulesBody.querySelector('[data-csv-file="' + type + '"]');
                            if (fileInput) { fileInput.value = ''; fileInput.click(); }
                        });
                    });

                    rulesBody.querySelectorAll('[data-csv-file]').forEach(function(fileInput) {
                        fileInput.addEventListener('change', function() {
                            if (!fileInput.files || !fileInput.files[0]) return;
                            var type = fileInput.getAttribute('data-csv-file');
                            var reader = new FileReader();
                            reader.onload = function(e) {
                                var rows = parseCSV(e.target.result);
                                if (rows.length === 0) {
                                    showToast('CSV 파일이 비어 있습니다', 'warning');
                                    return;
                                }
                                var hasHeader = detectHeaderRow(rows, type === 'forbidden' ? 'forbidden' : 'groups');
                                if (hasHeader) rows = rows.slice(1);
                                showCsvPreview(type, rows);
                            };
                            reader.readAsText(fileInput.files[0]);
                        });
                    });

                    // ── 5-1. CSV 템플릿 다운로드 ──
                    rulesBody.querySelectorAll('[data-csv-template]').forEach(function(link) {
                        link.addEventListener('click', function() {
                            var type = link.getAttribute('data-csv-template');
                            var csv, filename;
                            if (type === 'forbidden') {
                                csv = CSV_TEMPLATE_FORBIDDEN;
                                filename = 'forbidden-terms-template.csv';
                            } else {
                                csv = CSV_TEMPLATE_GROUPS;
                                filename = 'consistency-groups-template.csv';
                            }
                            var bom = '\uFEFF';
                            var blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
                            var url = URL.createObjectURL(blob);
                            var a = document.createElement('a');
                            a.href = url;
                            a.download = filename;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        });
                    });
                }

                // ── 5-1. CSV 미리보기 렌더링 ──
                function showCsvPreview(type, rows) {
                    var area = rulesBody.querySelector('[data-preview-for="' + type + '"]');
                    if (!area) return;

                    var parsed = [];
                    var skipped = 0;

                    if (type === 'forbidden') {
                        for (var i = 0; i < rows.length; i++) {
                            if (rows[i].length < 2 || !rows[i][0]) { skipped++; continue; }
                            parsed.push({ term: rows[i][0], replacement: rows[i][1] || '' });
                        }
                    } else {
                        for (var i = 0; i < rows.length; i++) {
                            var terms = rows[i].filter(Boolean);
                            if (terms.length < 2) { skipped++; continue; }
                            parsed.push(terms);
                        }
                    }

                    if (parsed.length === 0) {
                        showToast('유효한 데이터가 없습니다' + (skipped > 0 ? ' (' + skipped + '행 건너뜀)' : ''), 'warning');
                        return;
                    }

                    var html = '<div class="vd-csv-preview">';
                    html += '<div class="vd-csv-preview-header">'
                        + '<span>미리보기</span>'
                        + '<span class="vd-csv-preview-count">' + parsed.length + '건' + (skipped > 0 ? ' (건너뜀 ' + skipped + ')' : '') + '</span>'
                        + '</div>';

                    html += '<div class="vd-csv-preview-overflow"><table>';
                    if (type === 'forbidden') {
                        html += '<thead><tr><th>금지어</th><th>대체어</th></tr></thead><tbody>';
                        for (var pi = 0; pi < parsed.length; pi++) {
                            html += '<tr><td>' + escapeHTML(parsed[pi].term) + '</td><td>' + escapeHTML(parsed[pi].replacement) + '</td></tr>';
                        }
                    } else {
                        html += '<thead><tr><th>그룹 용어</th></tr></thead><tbody>';
                        for (var pi = 0; pi < parsed.length; pi++) {
                            html += '<tr><td>' + parsed[pi].map(escapeHTML).join(', ') + '</td></tr>';
                        }
                    }
                    html += '</tbody></table></div>';

                    html += '<div class="vd-csv-merge">'
                        + '<label><input type="radio" name="csv-merge-' + type + '" value="append" checked> 기존 데이터에 추가</label>'
                        + '<label><input type="radio" name="csv-merge-' + type + '" value="replace"> 기존 데이터 대체</label>'
                        + '</div>';

                    html += '<div class="vd-csv-preview-actions">'
                        + '<button data-csv-cancel="' + type + '">취소</button>'
                        + '<button class="primary" data-csv-apply="' + type + '">적용 (' + parsed.length + '건)</button>'
                        + '</div>';
                    html += '</div>';

                    area.innerHTML = html;

                    // 미리보기 이벤트
                    area.querySelector('[data-csv-cancel]').addEventListener('click', function() {
                        area.innerHTML = '';
                    });

                    area.querySelector('[data-csv-apply]').addEventListener('click', function() {
                        var mergeMode = area.querySelector('input[name="csv-merge-' + type + '"]:checked').value;

                        if (type === 'forbidden') {
                            var rule = currentRules.rules && currentRules.rules.forbidden_terms;
                            if (rule) {
                                if (!rule.params) rule.params = { terms: [] };
                                if (!rule.params.terms) rule.params.terms = [];
                                if (mergeMode === 'replace') {
                                    rule.params.terms = parsed;
                                } else {
                                    var existing = {};
                                    rule.params.terms.forEach(function(t) { existing[t.term] = true; });
                                    var added = 0;
                                    parsed.forEach(function(t) {
                                        if (!existing[t.term]) { rule.params.terms.push(t); added++; }
                                    });
                                    showToast(added + '건 추가됨' + (parsed.length - added > 0 ? ', ' + (parsed.length - added) + '건 중복 건너뜀' : ''), 'success');
                                    area.innerHTML = '';
                                    rebuildAndBind();
                                    return;
                                }
                            }
                        } else {
                            var rule = currentRules.rules && currentRules.rules.inconsistent_terms;
                            if (rule) {
                                if (!rule.params) rule.params = { groups: [] };
                                if (!rule.params.groups) rule.params.groups = [];
                                if (mergeMode === 'replace') {
                                    rule.params.groups = parsed;
                                } else {
                                    parsed.forEach(function(g) { rule.params.groups.push(g); });
                                }
                            }
                        }

                        showToast(parsed.length + '건 적용됨', 'success');
                        area.innerHTML = '';
                        rebuildAndBind();
                    });
                }

                function rebuildAndBind() {
                    rulesBody.innerHTML = buildBody();
                    bindRuleEvents();
                }

                bindRuleEvents();

                // ── 5-2. JSON 내보내기 ──
                overlay.querySelector('#vd-json-export').addEventListener('click', function() {
                    var exportData = {
                        presets: presets,
                        active_preset: activePreset,
                        exported_at: new Date().toISOString()
                    };
                    var blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'compare-rules-' + activePreset + '.json';
                    a.click();
                    URL.revokeObjectURL(a.href);
                    showToast('규칙 세트를 내보냈습니다', 'success');
                });

                // ── 5-2. JSON 가져오기 ──
                var jsonFileInput = overlay.querySelector('#vd-json-file');
                overlay.querySelector('#vd-json-import').addEventListener('click', function() {
                    jsonFileInput.value = '';
                    jsonFileInput.click();
                });
                jsonFileInput.addEventListener('change', function() {
                    if (!jsonFileInput.files || !jsonFileInput.files[0]) return;
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            var data = JSON.parse(e.target.result);
                            // 스키마 검증
                            if (!data.presets || typeof data.presets !== 'object') {
                                showToast('잘못된 규칙 파일 형식입니다 (presets 누락)', 'error');
                                return;
                            }
                            var keys = Object.keys(data.presets);
                            if (keys.length === 0) {
                                showToast('프리셋이 비어 있습니다', 'error');
                                return;
                            }
                            // 각 프리셋 구조 검증
                            for (var k = 0; k < keys.length; k++) {
                                var p = data.presets[keys[k]];
                                if (!p.rules || typeof p.rules !== 'object') {
                                    showToast('프리셋 "' + keys[k] + '"의 rules가 올바르지 않습니다', 'error');
                                    return;
                                }
                            }
                            // 적용
                            for (var k = 0; k < keys.length; k++) {
                                presets[keys[k]] = data.presets[keys[k]];
                            }
                            if (data.active_preset && presets[data.active_preset]) {
                                activePreset = data.active_preset;
                            }
                            currentRules = JSON.parse(JSON.stringify(presets[activePreset] || {}));
                            // 프리셋 드롭다운 재생성
                            var presetSelect = overlay.querySelector('#vd-preset-select');
                            presetSelect.innerHTML = '';
                            for (var pKey in presets) {
                                var opt = document.createElement('option');
                                opt.value = pKey;
                                opt.textContent = presets[pKey].label || pKey;
                                if (pKey === activePreset) opt.selected = true;
                                presetSelect.appendChild(opt);
                            }
                            rebuildAndBind();
                            showToast('규칙 세트를 가져왔습니다 (' + keys.length + '개 프리셋)', 'success');
                        } catch (err) {
                            showToast('JSON 파싱 실패: ' + err.message, 'error');
                        }
                    };
                    reader.readAsText(jsonFileInput.files[0]);
                });

                // 적용 + 재검증
                overlay.querySelector('#vd-modal-apply').addEventListener('click', function() {
                    // 현재 수정사항을 presets에 반영
                    presets[activePreset] = currentRules;
                    var saveData = { presets: presets, active_preset: activePreset };

                    fetch(API_BASE + '/compare/rules', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(saveData)
                    })
                    .then(function(res) {
                        if (!res.ok) throw new Error('저장 실패');
                        closeModal();
                        showToast('규칙이 저장되었습니다', 'success');
                        if (docState.a.paragraphs.length > 0) {
                            runValidation();
                        }
                    })
                    .catch(function(err) {
                        showToast('규칙 저장 실패: ' + err.message, 'error');
                    });
                });
            }

        })();

        // ── 공통 툴팁 (이벤트 위임) ──
        (function() {
            var popup = document.createElement('div');
            popup.className = 'tooltip-popup';
            document.body.appendChild(popup);
            var hideTimer = null;

            document.addEventListener('mouseenter', function(e) {
                if (e.target.nodeType !== 1) return;
                var icon = e.target.closest('.tooltip-icon');
                if (!icon) return;
                var text = icon.getAttribute('data-tooltip');
                if (!text) return;

                clearTimeout(hideTimer);
                popup.textContent = text;
                popup.className = 'tooltip-popup';

                // 위치 계산
                var rect = icon.getBoundingClientRect();
                var popupW = 280;
                var left = rect.left;
                if (left + popupW > window.innerWidth - 12) {
                    left = window.innerWidth - popupW - 12;
                }
                if (left < 12) left = 12;

                // 아래쪽 우선, 공간 부족 시 위쪽
                popup.style.left = left + 'px';
                popup.style.width = 'max-content';
                popup.style.maxWidth = popupW + 'px';
                popup.style.visibility = 'hidden';
                popup.style.display = 'block';
                popup.classList.add('visible');

                var popupH = popup.offsetHeight;
                var spaceBelow = window.innerHeight - rect.bottom - 12;

                if (spaceBelow >= popupH + 8) {
                    popup.style.top = (rect.bottom + 8) + 'px';
                    popup.classList.add('arrow-top');
                } else {
                    popup.style.top = (rect.top - popupH - 8) + 'px';
                    popup.classList.add('arrow-bottom');
                }

                // 꼬리 위치 (CSS 변수로 전달)
                var arrowLeft = rect.left + rect.width / 2 - left - 5;
                if (arrowLeft < 8) arrowLeft = 8;
                if (arrowLeft > popupW - 18) arrowLeft = popupW - 18;
                popup.style.setProperty('--_al', arrowLeft + 'px');
                popup.style.visibility = '';
            }, true);

            document.addEventListener('mouseleave', function(e) {
                if (e.target.nodeType !== 1) return;
                var icon = e.target.closest('.tooltip-icon');
                if (!icon) return;
                hideTimer = setTimeout(function() {
                    popup.classList.remove('visible');
                }, 100);
            }, true);
        })();
    </script>
</body>
</html>
