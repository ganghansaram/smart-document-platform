<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook — Smart Document Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/scrollbar.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/platform-header.css">
    <link rel="stylesheet" href="css/platform-footer.css">
    <link rel="stylesheet" href="css/tree-menu.css">
    <link rel="stylesheet" href="css/translator.css">
</head>
<body>
    <!-- Search Overlay -->
    <div class="ts-search-overlay" id="ts-search-overlay">
        <div class="ts-search-container">
            <input type="text" class="ts-search-input" id="ts-search-input" placeholder="문서 본문, 메모 검색..." autocomplete="off">
            <button class="ts-search-close" id="ts-search-close">&times;</button>
            <div class="ts-search-results" id="ts-search-results"></div>
        </div>
    </div>

    <div class="translator-body">
        <!-- Tree Panel: overlay -->
        <div class="tree-panel-overlay" id="tp-overlay">
            <div class="tp-header">
                <span class="tp-header-title">내 문서</span>
                <button class="tp-btn" id="tp-new-folder" title="새 폴더">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                </button>
                <button class="tp-btn" id="tp-pin" title="패널 고정">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76z"/></svg>
                </button>
            </div>
            <div class="tree-menu" id="tp-tree"></div>
        </div>

        <!-- Tree Panel: trigger handle -->
        <div class="tree-panel-trigger" id="tp-trigger"></div>

        <!-- Context Menu -->
        <div class="tp-context-menu" id="tp-ctx-menu"></div>

        <!-- Folder Picker Dialog -->
        <div class="folder-picker-overlay" id="fp-overlay">
            <div class="folder-picker" id="fp-dialog">
                <h3>이동할 폴더 선택</h3>
                <div class="folder-picker-list" id="fp-list"></div>
                <div class="folder-picker-actions">
                    <button class="fp-cancel" id="fp-cancel">취소</button>
                    <button class="fp-submit" id="fp-submit">이동</button>
                </div>
            </div>
        </div>

        <!-- State 1: Document List + Upload -->
        <div class="view-list" id="view-list">
            <!-- Hero Banner -->
            <div class="hero-banner">
                <img class="hero-banner-img" src="css/images/night_sky.png" alt="" decoding="async">
                <div class="hero-star"></div>
                <div class="hero-overlay">
                    <h2>Your Docs, Your Knowledge</h2>
                </div>
                <div class="hero-features">
                    <span class="hero-feature-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                    </span>
                    <span class="hero-feature-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="8" height="18" rx="1"/><rect x="14" y="3" width="8" height="18" rx="1"/><path d="M6 8h0"/><path d="M6 12h0"/><path d="M18 8h0"/><path d="M18 12h0"/></svg>
                    </span>
                    <span class="hero-feature-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                    </span>
                    <span class="hero-feature-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </span>
                </div>
                <div class="hero-banner-fade"></div>
            </div>
            <div class="upload-zone" id="upload-zone">
                <div class="upload-zone-icon">&#128196;</div>
                <div class="upload-zone-text">PDF 파일을 드래그하거나 클릭하여 업로드</div>
                <div class="upload-zone-hint">최대 100MB</div>
                <input type="file" id="file-input" accept=".pdf" multiple>
            </div>
            <div class="doc-grid" id="doc-grid"></div>
            <div id="translator-footer"></div>
        </div>

        <!-- State 2: Dual Panel Viewer -->
        <div class="view-viewer" id="view-viewer">
            <!-- 범위 번역 다이얼로그 -->
            <div class="range-dialog-overlay" id="range-dialog-overlay">
                <div class="range-dialog" id="range-dialog">
                    <h3>범위 번역</h3>
                    <div class="range-inputs">
                        <label>시작:</label>
                        <input type="number" id="range-start" min="1" value="1">
                        <label>끝:</label>
                        <input type="number" id="range-end" min="1" value="1">
                    </div>
                    <div class="range-hint">최대 5페이지까지 한 번에 번역</div>
                    <div class="range-error" id="range-error"></div>
                    <div class="range-actions">
                        <button class="btn-range-cancel" id="range-cancel-btn">취소</button>
                        <button class="btn-range-submit" id="range-submit-btn">번역</button>
                    </div>
                </div>
            </div>
            <div class="viewer-panels" id="viewer-panels">
                <!-- Main: Original PDF -->
                <div class="viewer-panel" id="panel-left">
                    <div class="panel-header" id="left-header">
                        <span class="panel-title">원문</span>
                        <span class="spacer"></span>
                        <button class="toolbar-btn" id="page-prev" title="이전 페이지">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <span class="translator-page-info" id="page-info">1 / 1</span>
                        <button class="toolbar-btn" id="page-next" title="다음 페이지">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                        <span class="ph-sep"></span>
                        <button class="toolbar-btn" id="zoom-out" title="축소">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </button>
                        <span class="zoom-level" id="zoom-level" title="클릭하면 100%로 초기화" style="cursor:pointer;">100%</span>
                        <button class="toolbar-btn" id="zoom-in" title="확대">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </button>
                        <span class="ph-sep"></span>
                        <span class="download-wrap" id="download-wrap">
                            <button class="toolbar-btn" id="download-btn" title="다운로드" aria-label="다운로드" aria-haspopup="true" aria-expanded="false">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </button>
                            <div class="download-menu" id="download-menu" role="menu">
                                <button class="download-menu-item" id="dl-original" role="menuitem">원본 PDF</button>
                                <button class="download-menu-item" id="dl-translated" role="menuitem" disabled>현재 페이지 번역 PDF</button>
                                <button class="download-menu-item" id="dl-web-page" role="menuitem" disabled style="display:none">현재 페이지 MD</button>
                                <button class="download-menu-item" id="dl-web-full" role="menuitem" disabled style="display:none">전체 문서 MD</button>
                            </div>
                        </span>
                    </div>
                    <div class="panel-scroll" id="left-scroll">
                        <div class="pdf-page-container" id="left-page-container">
                            <canvas id="left-canvas"></canvas>
                            <div class="text-layer" id="left-text-layer"></div>
                            <div class="annotation-layer" id="left-annotation-layer"></div>
                        </div>
                    </div>
                </div>
                <!-- Side Panel (wraps existing panel-right) -->
                <div class="side-panel" id="side-panel">
                    <!-- PDF 번역 헤더 -->
                    <div class="panel-header sp-hdr" id="hdr-pdf" style="display:none">
                        <span class="panel-title">PDF 번역</span>
                        <span class="panel-status" id="toolbar-page-status"></span>
                        <span class="spacer"></span>
                        <button class="toolbar-btn" id="range-translate-btn">범위</button>
                        <button class="toolbar-btn active" id="scroll-sync-btn" title="동기화">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h-4v10h4"/><path d="M16 7h4v10h-4"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                        </button>
                        <span class="ph-sep"></span>
                        <span class="shared-slot" id="shared-slot-pdf"></span>
                        <span class="ph-sep"></span>
                        <button class="sp-btn sp-expand-btn" title="확장">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        </button>
                        <button class="sp-btn sp-close-btn" title="닫기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <!-- 웹뷰 번역 헤더 -->
                    <div class="panel-header sp-hdr" id="hdr-web" style="display:none">
                        <span class="panel-title">웹 뷰 번역</span>
                        <span class="panel-status" id="web-status"></span>
                        <span class="spacer"></span>
                        <span class="font-scale-controls" id="font-scale-controls">
                            <button class="toolbar-btn" id="font-scale-down" title="폰트 축소">
                                <svg viewBox="0 0 24 24" fill="none" stroke="none"><text x="1" y="20" font-size="18" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">A</text><text x="15" y="16" font-size="9" font-weight="600" font-family="Arial,sans-serif" fill="currentColor">A</text></svg>
                            </button>
                            <span class="font-scale-value" id="font-scale-value">15px</span>
                            <button class="toolbar-btn" id="font-scale-up" title="폰트 확대">
                                <svg viewBox="0 0 24 24" fill="none" stroke="none"><text x="1" y="16" font-size="9" font-weight="600" font-family="Arial,sans-serif" fill="currentColor">A</text><text x="9" y="20" font-size="18" font-weight="700" font-family="Arial,sans-serif" fill="currentColor">A</text></svg>
                            </button>
                        </span>
                        <button class="toolbar-btn" id="web-full-toggle" title="전체 문서 보기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
                        </button>
                        <span class="ph-sep"></span>
                        <span class="shared-slot" id="shared-slot-web"></span>
                        <span class="ph-sep"></span>
                        <button class="sp-btn sp-expand-btn" title="확장">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        </button>
                        <button class="sp-btn sp-close-btn" title="닫기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <!-- 메모 헤더 -->
                    <div class="panel-header sp-hdr" id="hdr-memo" style="display:none">
                        <span class="panel-title">메모</span>
                        <span class="spacer"></span>
                        <span class="ph-sep"></span>
                        <button class="sp-btn sp-expand-btn" title="확장">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        </button>
                        <button class="sp-btn sp-close-btn" title="닫기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <!-- 용어집 헤더 -->
                    <div class="panel-header sp-hdr" id="hdr-glossary" style="display:none">
                        <span class="panel-title">용어집</span>
                        <span class="spacer"></span>
                        <button class="toolbar-btn" id="glossary-btn" title="용어집 편집">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                        </button>
                        <span class="ph-sep"></span>
                        <button class="sp-btn sp-expand-btn" title="확장">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        </button>
                        <button class="sp-btn sp-close-btn" title="닫기">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <!-- 공유 요소 (model, translate, cancel) — 활성 헤더의 shared-slot에 이동됨 -->
                    <div id="shared-controls-home" style="display:none">
                        <select class="form-select form-select-sm" id="model-select"></select>
                        <button class="translate-page-btn" id="translate-page-btn">번역</button>
                        <button class="cancel-page-btn" id="cancel-page-btn" style="display:none">취소</button>
                    </div>
                    <!-- 엔진 토글 (hidden, JS 참조용) -->
                    <div id="engine-toggle" style="display:none"></div>
                    <div class="viewer-panel" id="panel-right">
                        <!-- 마킹 플로팅 위젯 (panel-scroll 밖 — 스크롤 추종 방지) -->
                        <div class="marking-float" id="marking-float">
                            <div class="mf-trigger" id="mf-trigger">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
                                <span class="mf-count" id="mf-count" style="display:none">0</span>
                            </div>
                            <div class="mf-dropdown" id="mf-dropdown">
                                <div class="mf-header">
                                    <span class="mf-title">마킹</span>
                                    <span class="mf-badge" id="mf-badge">0</span>
                                </div>
                                <div class="mf-body" id="mf-body"></div>
                            </div>
                        </div>
                      <div class="panel-scroll" id="right-scroll">
                        <div class="pdf-page-container" id="right-page-container" style="display:none">
                            <canvas id="right-canvas"></canvas>
                            <div class="text-layer" id="right-text-layer"></div>
                            <div class="annotation-layer" id="right-annotation-layer"></div>
                        </div>
                        <div class="web-view-container" id="web-view-container" style="display:none">
                            <div class="web-view-content markdown-body" id="web-view-content"></div>
                        </div>
                        <div class="right-panel-placeholder" id="right-placeholder">
                            <div class="placeholder-icon">&#128221;</div>
                            <div class="placeholder-text">이 페이지는 아직 번역되지 않았습니다</div>
                            <div class="placeholder-hint">아래 "이 페이지 번역" 버튼을 눌러 시작하세요 (~30초)</div>
                        </div>
                      </div><!-- /panel-scroll -->
                    </div>
                </div>
                <!-- Icon Rail -->
                <div class="icon-rail" id="icon-rail">
                    <!-- 문서 도구 -->
                    <button class="rail-btn active" data-panel="pdf-translate" title="PDF 번역">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
                    </button>
                    <button class="rail-btn" data-panel="web-translate" title="웹 뷰 번역">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </button>
                    <button class="rail-btn" data-panel="memo" title="메모">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <button class="rail-btn" data-panel="glossary" title="용어집">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    </button>
                    <div class="rail-separator"></div>
                    <!-- AI · 분석 -->
                    <button class="rail-btn" data-panel="ai-summary" title="AI 요약 · Q&A" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    </button>
                    <button class="rail-btn" title="문서 요약" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                    </button>
                    <button class="rail-btn" data-panel="mindmap" title="마인드맵" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><line x1="10" y1="10" x2="6" y2="7"/><line x1="14" y1="10" x2="18" y2="7"/><line x1="10" y1="14" x2="6" y2="17"/><line x1="14" y1="14" x2="18" y2="17"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- 용어집 모달 -->
    <div class="modal-overlay" id="glossary-modal" style="display:none">
        <div class="modal-box" style="max-width:600px">
            <div class="modal-header">
                <h3>용어집</h3>
                <button class="modal-close" id="glossary-modal-close">&times;</button>
            </div>
            <div class="modal-body" style="padding:12px 20px">
                <div style="display:flex;gap:8px;margin-bottom:12px">
                    <input class="form-input form-input-sm" id="glossary-source" placeholder="원문 (예: availability)" style="flex:1">
                    <input class="form-input form-input-sm" id="glossary-target" placeholder="번역 (예: 가용성)" style="flex:1">
                    <button class="btn btn-primary btn-sm" id="glossary-add-btn">추가</button>
                </div>
                <div style="max-height:320px;overflow-y:auto">
                    <table style="width:100%;border-collapse:collapse" id="glossary-table">
                        <thead>
                            <tr style="border-bottom:1px solid var(--border-color)">
                                <th style="text-align:left;padding:6px 8px;font-size:13px;color:var(--medium-gray)">원문</th>
                                <th style="text-align:left;padding:6px 8px;font-size:13px;color:var(--medium-gray)">번역</th>
                                <th style="width:40px"></th>
                            </tr>
                        </thead>
                        <tbody id="glossary-tbody"></tbody>
                    </table>
                    <p id="glossary-empty" style="text-align:center;color:var(--medium-gray);font-size:13px;padding:24px 0">등록된 용어가 없습니다</p>
                </div>
            </div>
            <div class="modal-footer">
                <span style="font-size:12px;color:var(--medium-gray);margin-right:auto" id="glossary-count">0개 용어</span>
                <button class="btn btn-secondary btn-sm" id="glossary-modal-cancel">닫기</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/lib/pdfjs/pdf.min.js"></script>
    <script src="js/lib/marked.min.js"></script>
    <script src="js/lib/purify.min.js"></script>
    <script src="js/platform-header.js"></script>
    <script src="js/platform-footer.js"></script>
    <script>
    // ── 테마 초기화 ──
    (function() {
        var saved = localStorage.getItem('theme');
        document.body.dataset.theme = (saved === 'dark') ? 'dark' : 'light';
    })();
    </script>
    <script src="js/translator.js"></script>
</body>
</html>
