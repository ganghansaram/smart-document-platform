server {
    listen 80;
    server_name _;

    # PDF 업로드 크기 제한
    client_max_body_size 100m;

    # ── 프론트엔드 정적 파일 (이미지에 포함) ──
    root /app/frontend;
    index launcher.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── config.js Docker 오버라이드 ──
    # Nginx가 원본 대신 Docker 전용 config를 응답 (캐시 금지)
    location = /js/config.js {
        alias /app/docker/config.docker.js;
        add_header Cache-Control "no-store";
    }

    # ── data/ 화이트리스트 (볼륨, 3개만 허용) ──
    # exact match가 prefix match보다 우선
    location = /data/menu.json         { alias /app/data/menu.json; }
    location = /data/search-index.json { alias /app/data/search-index.json; }
    location = /data/glossary.json     { alias /app/data/glossary.json; }

    # ── 웹북 콘텐츠 (볼륨) ──
    location ^~ /contents/ {
        alias /app/contents/;
    }

    # ── API 리버스 프록시 ──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 번역 등 장시간 API 대응
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE/NDJSON 스트리밍 (챗봇, Q&A)
        proxy_buffering off;
    }

    # ── 보안 차단 (catch-all, 위 화이트리스트보다 후순위) ──
    location /data/    { return 403; }
    location /backend/ { return 403; }
    location /models/  { return 403; }
    location /tools/   { return 403; }
    location /backups/ { return 403; }
    location /.env     { return 403; }
    location ~ /\.git  { return 403; }

    # ── 정적 자산 캐싱 ──
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
