# ============================================================================
# Nginx 개발용 설정 — bind mount 환경에서 파일 변경사항 즉시 반영 목적
# ============================================================================
# docker-compose.override.yml이 이 파일을 컨테이너의 default.conf로 마운트한다.
# 프로덕션은 `docker/nginx.conf`를 그대로 사용 (override 미적용 시).
#
# 개발 설정 차이:
#   1. sendfile off — WSL2/Windows bind mount에서 파일 변경 전파 문제 방지
#   2. etag off + if_modified_since off — 304 캐싱 비활성화
#   3. expires/Cache-Control 무효화 — 브라우저 캐시 방지
#   4. open_file_cache off — nginx 메모리 내 파일 메타데이터 캐시 비활성화
#
# 나머지는 프로덕션 nginx.conf와 동일해야 한다 (기능 일관성).
# ============================================================================

server {
    listen 80;
    server_name _;

    # ── bind mount 대응: 파일 캐시·전송 최적화 비활성화 ──
    sendfile off;
    etag off;
    if_modified_since off;
    open_file_cache off;

    # PDF 업로드 크기 제한
    client_max_body_size 100m;

    # ── 프론트엔드 정적 파일 (bind mount로 호스트에서 실시간 반영) ──
    root /app/frontend;
    index launcher.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── config.js Docker 오버라이드 ──
    location = /js/config.js {
        alias /app/docker/config.docker.js;
        add_header Cache-Control "no-store";
    }

    # ── data/ 화이트리스트 (볼륨, 3개만 허용) ──
    location = /data/menu.json         { alias /app/data/menu.json; }
    location = /data/search-index.json { alias /app/data/search-index.json; }
    location = /data/glossary.json     { alias /app/data/glossary.json; }

    # ── 웹북 콘텐츠 (볼륨) ──
    location ^~ /contents/ {
        alias /app/contents/;
    }

    # ── API 리버스 프록시 ──
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_buffering off;
    }

    # ── 보안 차단 ──
    location /data/    { return 403; }
    location /backend/ { return 403; }
    location /models/  { return 403; }
    location /tools/   { return 403; }
    location /backups/ { return 403; }
    location /.env     { return 403; }
    location ~ /\.git  { return 403; }

    # ── 개발 모드: 정적 자산 캐시 완전 비활성화 ──
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot|html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # gzip 압축 (개발도 유지 — 네트워크 전송만 압축)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
